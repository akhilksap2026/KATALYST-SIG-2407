# ─────────────────────────────────────────────────────────────────────────────
# Katalyst — local development stack
#
# Usage:
#   docker compose up --build          # first run (builds image + starts DB)
#   docker compose up                  # subsequent runs
#   docker compose down -v             # stop and remove volumes
#
# The app self-migrates (schema.sql) and self-seeds on first boot.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: katalyst-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       katalyst
      POSTGRES_USER:     katalyst
      POSTGRES_PASSWORD: katalyst_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"           # expose to host for local psql / DBeaver
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U katalyst -d katalyst"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Katalyst API + UI ──────────────────────────────────────────────────────
  katalyst:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: katalyst-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://katalyst:katalyst_secret@postgres:5432/katalyst
      NODE_ENV:     production
      PORT:         5000
      # PGWAIT_SECONDS: 60   # override Postgres wait timeout (default 60s)
      # PGWAIT_EXTRA:   2    # extra sleep after Postgres is reachable
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    driver: local
