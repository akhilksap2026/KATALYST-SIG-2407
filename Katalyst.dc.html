      }}));

    const testSkeleton=
      '\n\n# ── Regression suite for '+ag.id+' ──\n'+
      '# Fill in the expected values for each test case, then click "Run tests".\n\n'+
      'test_suite:\n'+
      '  - id: TC-01\n'+
      '    name: "Happy path — standard trigger"\n'+
      '    trigger: '+ag.trigger+'\n'+
      '    expect: "agent completes without error"\n'+
      '    # assert: <field> == <expected value>\n\n'+
      '  - id: TC-02\n'+
      '    name: "Guard condition — reject when precondition missing"\n'+
      '    trigger: '+ag.trigger+'\n'+
      '    setup: "<set a required field to null>"\n'+
      '    expect: "agent exits at guard, no writes performed"\n\n'+
      '  - id: TC-03\n'+
      '    name: "Downstream event — verify emitted event"\n'+
      '    trigger: '+ag.trigger+'\n'+
      '    expect: "'+ag.evt+' emitted with correct GID"\n';
    const emptySuite=this.card(
      h(React.Fragment,{},'Regression suite ', this.mono('no saved suite',C.dim,11)),
      h('div',{style:{padding:'8px 0'}},
        h('div',{style:{display:'flex',gap:14,alignItems:'flex-start',marginBottom:18,background:C.navy+'08',border:'1px solid '+C.navy+'22',borderRadius:8,padding:'12px 16px'}},
          h('span',{style:{fontSize:18,lineHeight:1,flex:'none'}},'📋'),
          h('div',{},
            h('div',{style:{fontSize:13,fontWeight:600,color:C.text,marginBottom:4}},ag.name+' has no saved test suite'),
            h('div',{style:{fontSize:12,color:C.dim,lineHeight:1.6}},
              'Define test cases in the config editor on the left. The bundled full example lives on AG-SHIP-RETENDER — switch to it to see a working suite, then return here to author your own.'))),
        h('div',{style:{display:'flex',gap:8,flexWrap:'wrap'}},
          this.btn('+ Create test skeleton',{onClick:()=>{
            const base=this.state.draftText!=null?this.state.draftText:this._cfgBase;
            this.setState({draftText:(base||'')+testSkeleton,draftSaved:false,testState:'idle',testResults:null});
            this.toast('Test skeleton added — fill in the expected values, then run the suite');}}),
          this.btn('Open example (AG-SHIP-RETENDER)',{onClick:()=>this.chooseAgent('AG-SHIP-RETENDER',{screen:'workbench'})}))),
      {style:{flex:1,minWidth:300}});
    const emptyPromoteBar=h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',gap:14,flexWrap:'wrap',marginTop:18,
      background:C.panel,border:'1px solid '+C.border,borderRadius:12,padding:'16px 20px',boxShadow:'0 1px 3px rgba(60,69,69,.06)'}},
      h('div',{style:{display:'flex',alignItems:'center',gap:12}},
        this.dot(C.gold,10),
        h('div',{},
          h('div',{style:{fontSize:13.5,fontWeight:600,color:C.text}},'No regression tests — promote with caution'),
          h('div',{style:{fontSize:12,color:C.dim,marginTop:3}},'Create a test suite above and run it before promoting to production.'))),
      this.btn('Promote to PROD →',{primary:true,onClick:()=>{
        const _ag=this.byId(this.state.activeAgent);
        this.setState({screen:'env',navPrev:'workbench',envTab:'promote',envPromoteFrom:'DEV',envPromoteTo:'PROD',envPromoteStep:1,envPromoteSelected:[_ag.id],envPromoteDone:false,promoteNewVer:''});
      }}));
    // ── a) ACTION TYPE CLASSIFICATION ─────────────────────────────────────────
    const curText=this.state.draftText!=null?this.state.draftText:baseText;
    const actionLines=[]; let inAct=false;
    curText.split('\n').forEach(raw=>{
      const trim=raw.trim();
      if(/^actions:/i.test(trim)){inAct=true;return;}
      if(inAct&&/^[a-zA-Z_]/.test(trim)&&!/^-/.test(trim)){inAct=false;}
      if(inAct&&/^\s*-\s+/.test(raw))actionLines.push(raw);
    });
    const classifyAction=line=>{
      const body=line.replace(/^\s*-\s+/,'').replace(/#.*$/,'').trim();
      if(!body) return null;
      if(/direct\s*sql/i.test(body))                             return {tag:'⚠ DIRECT SQL',  col:C.red,    note:'bypasses OTM domain model — review before promoting to PROD'};
      if(/^(emit|raise)\s+(event|hint)/i.test(body))             return {tag:'OTM EVENT',     col:C.purple, note:'triggers downstream agents on this event'};
      if(/^set\s+field/i.test(body))                             return {tag:'OTM SET FIELD', col:'#1A8C5C',note:'domain-safe write via OTM field setter'};
      if(/^set\s+status|^set\w*status/i.test(body))              return {tag:'OTM SET STATUS',col:'#1A8C5C',note:'OTM state machine transition'};
      if(/^on(accept|decline|timeout|error|cancel)/i.test(body)) return {tag:'OTM HANDLER',  col:C.teal,   note:'conditional branch handler'};
      if(/^(recalc|load model|run inference|select\s*(next|service)|extract features|validate|record|log|send)/i.test(body)||/^\w+\([^)]*\)$/.test(body))
                                                                  return {tag:'OTM BUILT-IN', col:C.navy,   note:'OTM platform built-in call'};
      return {tag:'OTM ACTION',col:C.faint,note:'unclassified — verify OTM execution path'};
    };
    const classifiedActs=actionLines.map(l=>({raw:l,cl:classifyAction(l)})).filter(x=>x.cl);
    const classifyCard=classifiedActs.length?this.card(
      h(React.Fragment,{},'Action Type Classification ',this.pill(classifiedActs.length+' action'+(classifiedActs.length>1?'s':''),C.faint)),
      h('div',{style:{display:'flex',flexDirection:'column',gap:2}},
        classifiedActs.map((x,i)=>{
          const {tag,col,note}=x.cl;
          const isSql=tag.includes('DIRECT SQL');
          return h('div',{key:i,style:{display:'flex',alignItems:'flex-start',gap:10,padding:'8px 10px',borderRadius:6,
            background:isSql?C.red+'07':col+'04',border:'1px solid '+col+(isSql?'28':'12'),marginBottom:1}},
            h('span',{style:{fontSize:9.5,fontWeight:700,color:col,background:col+'14',border:'1px solid '+col+'28',
              borderRadius:3,padding:'2px 7px',fontFamily:'JetBrains Mono,monospace',whiteSpace:'nowrap',flex:'none',letterSpacing:'.3px'}},tag),
            h('div',{style:{flex:1,minWidth:0}},
              h('div',{style:{fontFamily:'JetBrains Mono,monospace',fontSize:11.5,color:C.text,lineHeight:1.5,wordBreak:'break-all'}},
                x.raw.replace(/^\s*-\s+/,'').trim()),
              note?h('div',{style:{fontSize:10.5,color:col,marginTop:2,opacity:.85}},note):null)); }))
    ):null;

    // ── b) GUARD CONDITION VALIDATION ──────────────────────────────────────────
    const condLines=[]; let inCond=false;
    curText.split('\n').forEach(raw=>{
      const trim=raw.trim();
      if(/^conditions:/i.test(trim)){inCond=true;return;}
      if(inCond&&/^[a-zA-Z_]/.test(trim)&&!/^-/.test(trim)){inCond=false;}
      if(inCond&&/^\s*-\s+/.test(raw))condLines.push(raw.replace(/^\s*-\s+/,'').trim());
    });
    const OTM_ENUMS={
      'SHIPMENT.STATUS':     {canonical:'SHIPMENT_STATUS',    values:['NEW','PLANNED','TENDERED','CONFIRMED','IN_TRANSIT','DELIVERED','CANCELLED']},
      'SHIPMENT.status':     {canonical:'SHIPMENT_STATUS',    values:['NEW','PLANNED','TENDERED','CONFIRMED','IN_TRANSIT','DELIVERED','CANCELLED']},
      'SHIPMENT_STATUS':     {canonical:'SHIPMENT_STATUS',    values:['NEW','PLANNED','TENDERED','CONFIRMED','IN_TRANSIT','DELIVERED','CANCELLED']},
      'TENDER_STATUS':       {canonical:'TENDER_STATUS',      values:['SENT','DECLINED','ACCEPTED','CANCELLED','EXPIRED']},
      'FREIGHT_BILL.STATUS': {canonical:'FREIGHT_BILL_STATUS',values:['RECEIVED','MATCHED','APPROVED','DISPUTED','PAID']},
      'FREIGHT_BILL.status': {canonical:'FREIGHT_BILL_STATUS',values:['RECEIVED','MATCHED','APPROVED','DISPUTED','PAID']},
      'FREIGHT_BILL_STATUS': {canonical:'FREIGHT_BILL_STATUS',values:['RECEIVED','MATCHED','APPROVED','DISPUTED','PAID']},
      'HOLD_STATUS':         {canonical:'HOLD_STATUS',        values:['ON_HOLD','RELEASED']},
    };
    const validateCond=cond=>{
      const eqM=cond.match(/^([\w.]+)\s*(?:=|!=|<>)\s*'([^']+)'/);
      if(eqM){
        const [,fld,val]=eqM;
        const entry=OTM_ENUMS[fld]||OTM_ENUMS[fld.toUpperCase()]||OTM_ENUMS[fld.toLowerCase()];
        if(entry){
          const ok=entry.values.some(v=>v.toLowerCase()===val.toLowerCase());
          return {fld,val,known:true,valid:ok,canonical:entry.canonical,values:entry.values};
        }
        if(/^(SHIPMENT|TENDER|FREIGHT_BILL|CARRIER_GID|ORDER_RELEASE|RATE_GID)\b/i.test(fld))
          return {fld,val,known:true,valid:true,canonical:null,values:null,note:'recognized OTM domain field'};
        return {fld,val,known:false,valid:true,canonical:null,values:null,note:'field not in OTM model index — verify manually'};
      }
      if(/\bis\s+(not\s+)?null\b/i.test(cond)){
        const nm=cond.match(/^([\w.]+)/);
        return {fld:nm?nm[1]:cond,val:'null',known:true,valid:true,canonical:null,values:null,note:'null check — valid for nullable OTM fields'};
      }
      if(/\bsysdate\b|\bcurrent_date\b|\bnow\b/i.test(cond)){
        const dm=cond.match(/^([\w.]+)/);
        return {fld:dm?dm[1]:cond,val:'date expr',known:true,valid:true,canonical:null,values:null,note:'date/time comparison against OTM sysdate'};
      }
      if(/^([\w.]+)\s*[<>]=?\s*([\w.]+)$/.test(cond)){
        const fm=cond.match(/^([\w.]+)/);
        return {fld:fm?fm[1]:cond,val:null,known:true,valid:true,canonical:null,values:null,note:'threshold or field-to-field comparison'};
      }
      if(/^[\w.]+$/.test(cond.trim()))
        return {fld:cond.trim(),val:null,known:true,valid:true,canonical:null,values:null,note:'existence / truthy check'};
      return null;
    };
    const condResults=condLines.map(c=>({cond:c,r:validateCond(c)}));
    const guardCard=condResults.length?this.card(
      h(React.Fragment,{},'Guard Condition Validation ',this.pill(condResults.length+' condition'+(condResults.length>1?'s':''),C.faint)),
      h('div',{style:{display:'flex',flexDirection:'column',gap:2}},
        condResults.map((x,i)=>{
          const {r}=x;
          const icon=!r?'○':r.valid?'✓':'⚠';
          const iconCol=!r?C.faint:r.valid&&r.canonical?'#1A8C5C':r.valid?C.teal:C.amber;
          return h('div',{key:i,style:{padding:'9px 12px',borderRadius:7,marginBottom:1,
            border:'1px solid '+(!r||r.valid?C.line:C.amber+'45'),
            background:!r||r.valid?'transparent':C.amber+'05'}},
            h('div',{style:{display:'flex',alignItems:'flex-start',gap:8}},
              h('span',{style:{fontFamily:'JetBrains Mono,monospace',fontSize:12.5,fontWeight:700,color:iconCol,flex:'none',marginTop:.5}},icon),
              h('div',{style:{flex:1}},
                h('div',{style:{fontFamily:'JetBrains Mono,monospace',fontSize:11.5,color:C.text,marginBottom:3}},x.cond),
                r&&r.valid&&r.canonical?h('div',{style:{fontSize:11,color:'#1A8C5C',lineHeight:1.5}},
                  '✓ ',h('span',{style:{fontFamily:'JetBrains Mono,monospace'}},r.fld),' is a valid OTM field  ·  ',
                  h('span',{style:{fontFamily:'JetBrains Mono,monospace',fontWeight:600}},"'"+r.val+"'"),' is a valid ',r.canonical,' value'):
                r&&!r.valid&&r.canonical?h('div',{},
                  h('div',{style:{fontSize:11,color:C.amber,lineHeight:1.5}},'⚠ ',
                    h('span',{style:{fontFamily:'JetBrains Mono,monospace',fontWeight:600}},"'"+r.val+"'"),
                    ' is not a standard ',r.canonical,' value'),
                  h('div',{style:{fontSize:10.5,color:C.dim,marginTop:3,fontFamily:'JetBrains Mono,monospace',lineHeight:1.5}},
                    'Valid values: '+r.values.join(', '))):
                r&&r.note?h('div',{style:{fontSize:11,color:C.dim,lineHeight:1.5}},r.note):null))); })
    )):null;

    // ── c) AGENT INTERACTION PREVIEW ──────────────────────────────────────────
    const writesM=curText.match(/^writes:\s*\[([^\]]*)\]/m);
    const draftWrites=writesM
      ?writesM[1].split(',').map(s=>s.trim()).filter(Boolean)
      :(ag.writes||[]);

    const affectedAgents=[];
    (this.agents||[]).forEach(other=>{
      if(other.id===ag.id) return;
      const hit=(other.reads||[]).filter(f=>draftWrites.includes(f));
      if(hit.length) affectedAgents.push({agent:other,fields:hit});
    });
    const affectedConflicts=[];
    (this.conflicts||[]).forEach(c=>{
      const hitF=draftWrites.filter(f=>
        (c.event&&c.event.includes(f))||
        (c.detail&&c.detail.includes(f))||
        (c.fix&&c.fix.includes(f)));
      if(hitF.length) affectedConflicts.push({c,fields:[...new Set(hitF)]});
    });
    const hasImpact=affectedAgents.length>0||affectedConflicts.length>0;

    const interactCard=draftWrites.length?this.card(
      h(React.Fragment,{},'Agent Interaction Preview ',
        this.pill(hasImpact?(affectedAgents.length+affectedConflicts.length)+' impact'+(affectedAgents.length+affectedConflicts.length>1?'s':''):'no downstream impact',
          hasImpact?C.amber:'#1A8C5C')),
      h('div',{},
        h('div',{style:{display:'flex',alignItems:'center',gap:8,padding:'8px 12px',borderRadius:7,
          background:C.navy+'06',border:'1px solid '+C.navy+'20',marginBottom:10}},
          h('span',{style:{fontSize:10,fontWeight:700,color:C.faint,textTransform:'uppercase',letterSpacing:'.5px',flex:'none',whiteSpace:'nowrap'}},'Draft writes'),
          h('div',{style:{display:'flex',gap:5,flexWrap:'wrap'}},
            draftWrites.map((f,fi)=>h('span',{key:fi,style:{fontFamily:'JetBrains Mono,monospace',fontSize:10.5,fontWeight:700,
              color:C.navy,background:C.navy+'12',border:'1px solid '+C.navy+'25',borderRadius:4,padding:'1px 8px'}},f)))),
        affectedAgents.length?h('div',{style:{marginBottom:8}},
          h('div',{style:{fontSize:10,fontWeight:700,color:C.dim,textTransform:'uppercase',letterSpacing:'.5px',marginBottom:5,paddingLeft:2}},
            'Downstream agents — will see changed values'),
          affectedAgents.map((x,xi)=>h('div',{key:xi,style:{display:'flex',alignItems:'flex-start',gap:10,padding:'8px 12px',
            borderRadius:6,border:'1px solid #1A8C5C28',background:'#1A8C5C05',marginBottom:3}},
            h('span',{style:{color:'#1A8C5C',fontWeight:700,fontSize:13,flex:'none',lineHeight:1.2}},'→'),
            h('div',{style:{flex:1,minWidth:0}},
              h('div',{style:{display:'flex',alignItems:'center',gap:7,flexWrap:'wrap',marginBottom:2}},
                h('button',{onClick:()=>this.chooseAgent(x.agent.id,{screen:'view'}),
                  style:{background:'none',border:'none',cursor:'pointer',padding:0,font:'inherit',
                    fontFamily:'JetBrains Mono,monospace',fontSize:11.5,fontWeight:700,color:C.teal}},x.agent.id),
                h('span',{style:{fontSize:11,color:C.dim}},'reads'),
                x.fields.map((f,fi)=>h('span',{key:fi,style:{fontFamily:'JetBrains Mono,monospace',fontSize:10,fontWeight:700,
                  color:'#1A8C5C',background:'#1A8C5C12',border:'1px solid #1A8C5C25',borderRadius:3,padding:'0 6px'}},f))),
              h('div',{style:{fontSize:11,color:C.dim}},x.agent.name+' — will see new values on next trigger'))))
        ):null,
        affectedConflicts.length?h('div',{},
          h('div',{style:{fontSize:10,fontWeight:700,color:C.dim,textTransform:'uppercase',letterSpacing:'.5px',marginBottom:5,paddingLeft:2}},
            'Open conflicts intersecting these fields'),
          affectedConflicts.map((x,xi)=>{
            const col=x.c.severity==='critical'?C.red:C.amber;
            const snippet=x.c.detail?(x.c.detail.length>130?x.c.detail.slice(0,130)+'…':x.c.detail):(x.c.a+' ↔ '+x.c.b);
            return h('div',{key:xi,style:{display:'flex',alignItems:'flex-start',gap:10,padding:'8px 12px',
              borderRadius:6,border:'1px solid '+col+'35',background:col+'05',marginBottom:3}},
              h('span',{style:{color:col,fontWeight:700,fontSize:13,flex:'none',lineHeight:1.2}},'→'),
              h('div',{style:{flex:1,minWidth:0}},
                h('div',{style:{display:'flex',alignItems:'center',gap:7,flexWrap:'wrap',marginBottom:2}},
                  h('button',{onClick:()=>this.go('conflicts'),
                    style:{background:'none',border:'none',cursor:'pointer',padding:0,font:'inherit',
                      fontFamily:'JetBrains Mono,monospace',fontSize:11.5,fontWeight:700,color:col}},x.c.id),
                  h('span',{style:{fontSize:9.5,fontWeight:700,color:col,background:col+'12',border:'1px solid '+col+'28',
                    borderRadius:3,padding:'0 5px',textTransform:'uppercase',letterSpacing:'.3px'}},x.c.severity),
                  h('span',{style:{fontSize:11,color:C.dim}},'involves'),
                  x.fields.map((f,fi)=>h('span',{key:fi,style:{fontFamily:'JetBrains Mono,monospace',fontSize:10,fontWeight:700,
                    color:col,background:col+'12',border:'1px solid '+col+'25',borderRadius:3,padding:'0 6px'}},f))),
                h('div',{style:{fontSize:11,color:C.dim,lineHeight:1.5}},snippet)));})
        ):null,
        !hasImpact?h('div',{style:{fontSize:12,color:'#1A8C5C',padding:'4px 2px',display:'flex',alignItems:'center',gap:6}},
          h('span',{style:{fontWeight:700}},'✓'),' No downstream reads or open conflicts detected for these write fields.'):null)
    ):null;

    const analysisRow=classifyCard||guardCard
      ?(classifyCard&&guardCard
          ?h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginTop:0}},classifyCard,guardCard)
          :h('div',{style:{marginTop:0}},classifyCard||guardCard))
      :null;

    // ── d) EVENT CROSS-REFERENCE ───────────────────────────────────────────────
    if(this.state.wbXrefGid!==ag.id){setTimeout(()=>fetch('/api/agents/xref?gid='+encodeURIComponent(ag.id)).then(r=>r.json()).then(x=>this.setState({wbXref:x,wbXrefGid:ag.id})).catch(()=>this.setState({wbXref:{triggers:[],triggered_by:[]},wbXrefGid:ag.id})),0);}
    const wbXrefCard=this.state.wbXrefGid===ag.id?this.card(
      h(React.Fragment,{},'Event Cross-Reference ',this.mono('↗ Triggers · ↙ Triggered By',C.dim,11)),
      this.renderXrefPanel(this.state.wbXref,gid=>this.smOpenAgent(gid)),
      {style:{marginTop:0}}):null;

    return h('div',{},
      h('div',{style:{display:'flex',gap:16,flexWrap:'wrap'}}, editor, isRetender?suite:emptySuite),
      analysisRow,
      interactCard,
      isRetender?behavior:null,
      wbXrefCard,
      isRetender?promoteBar:emptyPromoteBar); }

  // ---------- CONFLICTS ----------
  renderConflicts(){ const C=this.C,h=React.createElement;
    const exp=this.state.conflictExpanded||{};
    const toggle=id=>{ const ne=Object.assign({},exp); ne[id]=!ne[id]; this.setState({conflictExpanded:ne}); };
    const nameLinkSty={background:'none',border:'none',cursor:'pointer',font:'inherit',color:C.teal,fontSize:12,fontWeight:600,padding:0,transition:'opacity 100ms'};
    const divider=h('span',{style:{color:C.border,fontSize:10,flex:'none'}},'│');

    const rows=this.conflicts.flatMap(c=>{
      const crit=c.severity==='critical'; const col=crit?C.red:C.amber;
      const a=this.byId(c.a), b=this.byId(c.b);
      const isExp=!!exp[c.id];
      const st=this.state.conflictStatus[c.id]||'open';
      const stcfg={open:{l:'Open',col:C.red},ack:{l:'Acked',col:C.navy},resolved:{l:'Resolved',col:'#1A8C5C'}}[st];

      const row=h('div',{key:c.id+'r',style:{display:'flex',alignItems:'center',gap:8,padding:'6px 12px',
        background:isExp?C.panel2:C.panel,borderLeft:'3px solid '+col,
        borderBottom:'1px solid '+C.border,transition:'background 80ms'}},
        h('span',{style:{display:'inline-flex',alignItems:'center',gap:4,fontSize:10,fontWeight:700,color:col,background:col+'12',border:'1px solid '+col+'30',borderRadius:3,padding:'2px 7px',whiteSpace:'nowrap',flex:'none'}},
          this.dot(col,5), crit?'Critical':'Warning'),
        this.mono(c.id,col,11),
        divider,
        h('span',{style:{fontSize:11,color:C.dim,flex:'none'}},'on '),
        this.mono(c.event,C.text,11.5),
        divider,
        h('button',{onClick:()=>this.chooseAgent(c.a,{screen:'workflow',selectedNode:c.a}),style:nameLinkSty},a?a.name:'—'),
        h('span',{style:{color:col,fontSize:13,fontWeight:700,lineHeight:1,flex:'none'}},' ⇄ '),
        h('button',{onClick:()=>this.chooseAgent(c.b,{screen:'workflow',selectedNode:c.b}),style:nameLinkSty},b?b.name:'—'),
        h('div',{style:{flex:1}}),
        h('span',{style:{fontSize:10,fontWeight:700,color:stcfg.col,background:stcfg.col+'14',border:'1px solid '+stcfg.col+'25',borderRadius:3,padding:'2px 7px',whiteSpace:'nowrap',flex:'none'}},stcfg.l),
        this.btn('Map',{onClick:()=>this.chooseAgent(c.a,{screen:'workflow',selectedNode:c.a}),style:{fontSize:10.5,padding:'3px 8px'}}),
        h('button',{onClick:()=>toggle(c.id),title:isExp?'Collapse':'Expand details',
          style:{display:'inline-flex',alignItems:'center',justifyContent:'center',width:24,height:24,
            background:isExp?C.navy+'12':'transparent',border:'1px solid '+C.border,borderRadius:4,
            cursor:'pointer',color:isExp?C.navy:C.dim,fontSize:11,flex:'none',
            transform:isExp?'rotate(180deg)':'none',transition:'transform 150ms,background 100ms'}},'▾'));

      const priPanelOpen=!!(this.state.conflictPriorityOpen||{})[c.id];
      const detail=isExp?h('div',{key:c.id+'d',style:{padding:'10px 14px 12px 46px',background:C.panel2,
        borderLeft:'3px solid '+col,borderBottom:'1px solid '+C.border}},
        h('div',{style:{fontSize:12,lineHeight:1.65,color:C.text,marginBottom:8}},c.detail),
        this._renderSeqDiagram(c,col),
        priPanelOpen?this._renderPriorityFix(c):null,
        h('div',{style:{display:'flex',gap:8,background:C.teal+'08',border:'1px solid '+C.teal+'28',borderRadius:6,padding:'7px 11px',marginBottom:7}},
          h('span',{style:{fontSize:9.5,fontWeight:700,color:C.teal,textTransform:'uppercase',letterSpacing:'.5px',flex:'none',paddingTop:2}},'Suggested fix'),
          h('div',{style:{fontSize:12,lineHeight:1.55,color:C.text}},c.fix)),
        this.conflictActions(c)):null;

      return detail?[row,detail]:[row]; });

    const nCrit=this.conflicts.filter(c=>c.severity==='critical').length;
    const nWarn=this.conflicts.length-nCrit;
    const header=h('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:8,flexWrap:'wrap'}},
      h('span',{style:{fontSize:13,fontWeight:600,color:C.text}},'Event Ordering Violations'),
      this.pill(nCrit+' critical',C.red), this.pill(nWarn+' warning',C.amber),
      h('div',{style:{flex:1}}),
      this.btn('Re-scan',{onClick:()=>this.toast('Scan complete — '+this.conflicts.length+' violations ('+nCrit+' critical, '+nWarn+' warning)')}));

  // ---------- ADMIN ----------
  async _loadAdminData(){
    if(this.state.adminLoaded) return;
    try {
      const [rolesRes,usersRes,ssoRes,keysRes,cfgRes]=await Promise.all([
        fetch('/api/admin/roles').then(r=>r.json()),
        fetch('/api/admin/users').then(r=>r.json()),
        fetch('/api/admin/sso').then(r=>r.json()),
        fetch('/api/admin/api-keys').then(r=>r.json()),
        fetch('/api/admin/global-config').then(r=>r.json()),
      ]);
      this.adminRoles=rolesRes; this.adminUsers=usersRes; this.ssoConnections=ssoRes;
      this.apiKeys=keysRes; this.globalConfig=cfgRes;
      this.setState({adminLoaded:true, adminLoadedAt:Date.now(), adminSelectedRole:rolesRes[0]?.id||null});
    } catch(e){ console.error('[Admin] load failed:',e); }
  }
  _refreshAdmin(){ this.setState({adminLoaded:false,adminLoadedAt:null},()=>this._loadAdminData()); }

  smOtmRelease(ver){
    if(!ver||!ver.trim()) return {label:'Version Unspecified',color:'#9CA3AF',gen:'unknown'};
    const m=ver.match(/^(\d+)\.(\d+)\./);
    if(!m) return {label:ver.split('-')[0],color:'#9CA3AF',gen:'unknown'};
    const maj=parseInt(m[1]),min=parseInt(m[2]);
    if(maj===24) return {label:'OTM 24C',color:'#78716C',gen:'legacy'};
    if(maj===25) return {label:'OTM 25A',color:'#6366F1',gen:'prev'};
    if(maj===26&&min===1) return {label:'OTM 26A',color:'#0EA5E9',gen:'recent'};
    if(maj===26&&min===2) return {label:'OTM 26B',color:'#10B981',gen:'current'};
    return {label:ver.split('-')[0],color:'#9CA3AF',gen:'unknown'};
  }

  smHash(str){
    let h=0;
    for(let i=0;i<str.length;i++) h=Math.imul(31,h)+str.charCodeAt(i)|0;
    return Math.abs(h);
  }

  smSeeded(seed){
    let s=seed>>>0;
    return ()=>{ s=(Math.imul(1664525,s)+1013904223)>>>0; return s/0xffffffff; };
  }

  smSimulateHealth(agent){
    // Seeded random — deterministic per agent GID across page reloads/filter changes
    const rand=this.smSeeded(this.smHash(agent.agent_gid||agent.id||''));
    const r=Array.from({length:8},()=>rand());
    const pad=n=>String(n).padStart(2,'0');
    const cx=parseFloat(agent.complexity_score)||0;
    const norm=parseInt(agent.norm_action_count)||0;
    const hasErr=(parseInt(agent.err_action_count)||0)>0;
    const isSingle=agent.is_single_thread===true||agent.is_single_thread==='t';

    // DB `health` field drives deterministic demo states.
    // 'error' / 'warning' override the random roll and scale metrics realistically.
    const dbHealth=(agent.health||'green').toLowerCase();
    const isError  = dbHealth==='error';
    const isWarn   = dbHealth==='warning';

    // Last-fired: errors fired recently but are stuck; warnings fired normally
    const hoursAgo = isError
      ? Math.max(1, Math.floor(1 + r[0]*5))     // 1-6 h ago — still trying, still failing
      : Math.max(1, Math.floor(1 + r[0]*71));    // normal 1-72 h range
    const d=new Date(Date.now()-hoursAgo*3600000);
    const lastFired=`${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;

    // Status: DB field wins for flagged agents; random for all others
    const status = isError ? 'ERROR'
                 : isWarn  ? 'WARNING'
                 : (r[4]>0.08 ? 'HEALTHY' : (r[5]>0.5 ? 'WARNING' : 'ERROR'));

    return {
      last_fired: lastFired,
      hours_ago:  hoursAgo,
      // ERROR → near-zero fires (stuck/crashing); WARNING → reduced but running
      fire_count_24h: isError ? Math.floor(r[1]*6)
                    : isWarn  ? Math.floor(20 + r[1]*60)
                    :           Math.floor(r[1]*(cx>50?200:50)),
      // ERROR → very slow (8-20 s, likely timing out); WARNING → elevated (2-6 s)
      avg_duration_ms: isError ? Math.floor(8000  + r[2]*12000)
                     : isWarn  ? Math.floor(2000  + r[2]*4000)
                     :           Math.floor(100   + r[2]*(norm*80)),
      // ERROR → high error rate (3.0-5.0 %); WARNING → moderate (1.0-3.0 %)
      error_rate_pct: isError ? +(3.0 + r[3]*2.0).toFixed(1)
                    : isWarn  ? +(1.0 + r[3]*2.0).toFixed(1)
                    :           (hasErr ? +(r[3]*5).toFixed(1) : 0),
      status,
      // ERROR → deep queue (8-15); WARNING → moderate (3-8); healthy → normal
      queue_depth: isError ? Math.floor(8  + r[6]*7)
                 : isWarn  ? Math.floor(3  + r[6]*5)
                 :           Math.floor(r[6]*(isSingle?15:3)),
    };
  }

  smParseParams(str){
    if(!str||!str.trim()) return [];
    const result=[],chunks=str.trim().split(/(?=\s+-\w)/);
    for(const chunk of chunks){
      const m=chunk.trim().match(/^-(\w+)\s*([\s\S]*)$/);
      if(!m||!m[1]) continue;
      let value=(m[2]||'').trim();
      if(value.startsWith('{')&&value.endsWith('}')) value=value.slice(1,-1).trim();
      result.push({key:m[1],value});
    }
    return result;
  }

  // ─── SKYMFG: 3B AGENT MAP ────────────────────────────────────────────────────

  renderSkymfgMap(){ const C=this.C,h=React.createElement;
    const tier=this.state.skymfgMapTier||1;
    const domain=this.state.skymfgDomain||null;
    const graphKey=(domain||'*')+':'+tier;
    const g=this.state.skymfgMapGraph;
    const hov=this.state.skymfgMapHovered;

    // Kick off async load when graph absent or stale
    if(!g||this.state.skymfgMapGraphKey!==graphKey){
      if(this._mapLoadKey!==graphKey){
        this._mapLoadKey=graphKey;
        this._fetchLinkGraph(domain,tier).then(graph=>{
          this.setState({skymfgMapGraph:graph,skymfgMapGraphKey:graphKey});
        });
      }
      return h('div',{style:{padding:'20px 24px',display:'flex',flexDirection:'column',height:'100%',boxSizing:'border-box'}},
        h('div',{style:{marginBottom:4,display:'flex',alignItems:'baseline',gap:10}},
          h('span',{style:{fontSize:20,fontWeight:800,color:C.text}},'Agent Map')),
        this.renderSkymfgDomainBar(),
        h('div',{style:{flex:1,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:12}},
          h('span',{style:{width:24,height:24,border:'3px solid '+C.teal+'30',borderTopColor:C.teal,borderRadius:'50%',display:'inline-block',animation:'spin 0.85s linear infinite'}}),
          h('span',{style:{fontSize:12,color:C.faint}},'Loading dependency graph…')));
    }

    // Edge visual style per link type
    const LS={
      RAISES_EVENT:          {color:'#DC2626',dash:null,    label:'RAISES EVENT'},
      FOR_EACH_DELEGATES:    {color:'#7C3AED',dash:null,    label:'FOR EACH'},
      WRAPPER_DELEGATES:     {color:'#2563EB',dash:'5,3',   label:'WRAPPER'},
      STATUS_CHAIN:          {color:'#059669',dash:null,    label:'STATUS CHAIN'},
      SHARED_EXTERNAL_SYSTEM:{color:'#0D9488',dash:'3,3',   label:'SHARED SYSTEM'},
      EXECUTION_PEER:        {color:'#6B7280',dash:'2,4',   label:'PEER'},
    };
    const CAUSAL=['RAISES_EVENT','FOR_EACH_DELEGATES','WRAPPER_DELEGATES','STATUS_CHAIN'];

    const edges=g.edges||[],nodes=g.nodes||[];
    const causalEdges=edges.filter(e=>CAUSAL.includes(e.link_type));

    // Agent meta lookup (version + functional_categories from loaded agents list)
    const agentMeta={};
    (this.skymfgAgents||[]).forEach(a=>{
      agentMeta[a.agent_gid]={
        otm_release:a.otm_release,
        functional_categories:a.functional_categories,
        is_active:a.is_active,
      };
    });

    // Build causal adjacency for layout
    const outE={},inE={};
    causalEdges.forEach(e=>{(outE[e.source]=outE[e.source]||[]).push(e.target);(inE[e.target]=inE[e.target]||[]).push(e.source);});

    // Partition: connected vs isolated
    const linkedGids=new Set(edges.flatMap(e=>[e.source,e.target]));
    const linkedNodes=nodes.filter(n=>linkedGids.has(n.agent_gid));
    const isolatedNodes=nodes.filter(n=>!linkedGids.has(n.agent_gid));

    // BFS layer assignment
    const layer={};
    const roots=linkedNodes.filter(n=>!inE[n.agent_gid]);
    if(!roots.length&&linkedNodes.length) roots.push(linkedNodes[0]);
    const bq=roots.map(n=>({id:n.agent_gid,d:0}));
    bq.forEach(({id,d})=>{layer[id]=d;});
    let bi=0;
    while(bi<bq.length){const{id,d}=bq[bi++];if(d>=5)continue;(outE[id]||[]).forEach(t=>{if(layer[t]===undefined||layer[t]<d+1){layer[t]=d+1;bq.push({id:t,d:d+1});}});}
    linkedNodes.forEach(n=>{if(layer[n.agent_gid]===undefined)layer[n.agent_gid]=0;});

    // Group by layer, sort alphabetically within column
    const byLayer={};
    linkedNodes.forEach(n=>{const l=layer[n.agent_gid]||0;(byLayer[l]=byLayer[l]||[]).push(n);});
    const COLS=Object.keys(byLayer).map(Number).sort((a,b)=>a-b);
    COLS.forEach(col=>{byLayer[col].sort((a,b)=>a.agent_xid.localeCompare(b.agent_xid));});

    // Pixel layout
    const NW=210,NH=92,COL_W=256,ROW_H=108,PX=20,PY=44;
    const colX={};COLS.forEach((col,i)=>{colX[col]=PX+i*COL_W;});
    const npos={};COLS.forEach(col=>{byLayer[col].forEach((n,i)=>{npos[n.agent_gid]={x:colX[col],y:PY+i*ROW_H};});});
    const maxRows=Math.max(...COLS.map(c=>byLayer[c].length),1);
    const totalH=PY+maxRows*ROW_H+PX,totalW=PX*2+COLS.length*COL_W;

    // Domain header positions: group linked nodes by domain, find min-y and min-x
    const domHdrs={};
    linkedNodes.forEach(n=>{
      const pos=npos[n.agent_gid];if(!pos)return;
      const dn=n.domain_name||'';
      if(!domHdrs[dn]||pos.x<domHdrs[dn].x||(pos.x===domHdrs[dn].x&&pos.y<domHdrs[dn].y))
        domHdrs[dn]={x:pos.x,y:pos.y,color:this.smDomainColor(dn),label:(dn||'').replace('SKYMFG/','').replace('SKYMFG','SkyMFG Root')};
    });

    // Hover highlight sets
    const hovEdgeSet=hov?new Set(edges.reduce((a,e,i)=>{if(e.source===hov||e.target===hov)a.push(i);return a;},[])):[null][0];
    const hovPeers=hov?new Set(edges.filter(e=>e.source===hov||e.target===hov).flatMap(e=>[e.source,e.target])):null;

    // Tier toggle
    const tBtn=(t,lbl)=>h('button',{key:t,onClick:()=>{this.setState({skymfgMapTier:t,skymfgMapGraph:null,skymfgMapGraphKey:null});this._mapLoadKey=null;},
      style:{font:'inherit',fontSize:10,fontWeight:700,padding:'4px 10px',borderRadius:5,border:'1px solid '+C.border,cursor:'pointer',
        background:tier===t?C.teal:C.panel2,color:tier===t?'#fff':C.dim,transition:'all 80ms'}},lbl);

    const legendTypes=tier===1?CAUSAL:tier===2?[...CAUSAL,'SHARED_EXTERNAL_SYSTEM']:Object.keys(LS);

    return h('div',{style:{padding:'20px 24px',display:'flex',flexDirection:'column',height:'100%',boxSizing:'border-box',overflow:'hidden'}},
      // Header
      h('div',{style:{marginBottom:4,display:'flex',alignItems:'center',gap:10,flexWrap:'wrap',flexShrink:0}},
        h('span',{style:{fontSize:20,fontWeight:800,color:C.text}},'Agent Map'),
        h('span',{style:{fontSize:12,color:C.faint,flex:1}},
          linkedNodes.length+' connected · '+(g.stats.isolated_agents||0)+' isolated · '+edges.length+' links'),
        h('div',{style:{display:'flex',alignItems:'center',gap:4}},
          h('span',{style:{fontSize:10,color:C.faint,marginRight:2}},'Show:'),
          tBtn(1,'Causal'),tBtn(2,'+ Systems'),tBtn(3,'All'))),
      this.renderSkymfgDomainBar(),
      // Legend
      h('div',{style:{marginBottom:8,flexShrink:0}},this.smLinkLegend(legendTypes)),
      // Graph viewport
      linkedNodes.length
        ?h('div',{style:{flex:1,overflowX:'auto',overflowY:'auto',border:'1px solid '+C.border,
            borderRadius:8,background:'#FAFAF9',position:'relative',minHeight:0}},
          h('div',{style:{position:'relative',width:Math.max(totalW,400),height:Math.max(totalH,200),minWidth:'100%'}},
            // Domain section headers
            ...Object.entries(domHdrs).map(([dn,dh])=>
              h('div',{key:'dh-'+dn,style:{position:'absolute',left:dh.x,top:dh.y-28,
                fontSize:9.5,fontWeight:800,color:dh.color,textTransform:'uppercase',
                letterSpacing:'.6px',whiteSpace:'nowrap',userSelect:'none',
                background:'#FAFAF9',paddingRight:6}},dh.label)),
            // SVG edge layer
            h('svg',{style:{position:'absolute',inset:0,width:'100%',height:'100%',pointerEvents:'none',overflow:'visible'}},
              h('defs',{},
                ...Object.entries(LS).map(([lt,s])=>
                  h('marker',{key:lt,id:'arrm-'+lt,markerWidth:7,markerHeight:7,refX:6,refY:3.5,orient:'auto'},
                    h('path',{d:'M0,0 L0,7 L7,3.5 z',fill:s.color})))),
              ...edges.map((e,i)=>{
                const sp=npos[e.source],tp=npos[e.target];if(!sp||!tp)return null;
                const s=LS[e.link_type]||{color:'#888',dash:null};
                const CAUSAL_E=CAUSAL.includes(e.link_type);
                // Exit right-center of source, enter left-center of target
                const x1=sp.x+NW,y1=sp.y+NH/2,x2=tp.x,y2=tp.y+NH/2;
                const dx=Math.abs(x2-x1),cpx=Math.min(dx*0.5,80);
                const mx=(x1+x2)/2,my=(y1+y2)/2;
                const isDimEdge=hovEdgeSet&&!hovEdgeSet.has(i);
                const lblTxt=e.link_detail?(e.link_detail.length>20?e.link_detail.slice(0,20)+'…':e.link_detail):null;
                return h(React.Fragment,{key:i},
                  h('path',{d:'M'+x1+','+y1+' C'+(x1+cpx)+','+y1+' '+(x2-cpx)+','+y2+' '+x2+','+y2,
                    fill:'none',stroke:s.color,
                    strokeWidth:isDimEdge?0.8:CAUSAL_E?2:1.4,
                    opacity:isDimEdge?0.15:CAUSAL_E?0.85:0.65,
                    strokeDasharray:s.dash||null,
                    markerEnd:CAUSAL_E?'url(#arrm-'+e.link_type+')':undefined}),
                  // Edge label pill — always shown, dimmed when not in hover set
                  lblTxt&&!isDimEdge?h(React.Fragment,{key:'lbl'},
                    h('rect',{x:mx-lblTxt.length*2.9,y:my-7,
                      width:lblTxt.length*5.8,height:13,rx:3,
                      fill:'white',opacity:0.88,stroke:s.color,strokeWidth:0.5,strokeOpacity:0.4}),
                    h('text',{x:mx,y:my+3,textAnchor:'middle',fontSize:7.5,fontWeight:700,
                      fill:s.color,fontFamily:'JetBrains Mono,monospace'},lblTxt)):null);})),
            // Node cards
            ...linkedNodes.map(n=>{
              const pos=npos[n.agent_gid];if(!pos)return null;
              const dc=this.smDomainColor(n.domain_name);
              const meta=agentMeta[n.agent_gid]||{};
              const isHub=n.is_hub,isH=hov===n.agent_gid;
              const isDim=hovPeers&&!hovPeers.has(n.agent_gid);
              const isActive=meta.is_active!==undefined?meta.is_active:n.is_active;
              const hDot=isActive?'#22C55E':'#F97316';
              const relVer=meta.otm_release?(meta.otm_release.split('-')[0]||meta.otm_release):'';
              const dqtShort=(n.data_query_type_gid||'').replace('SKYMFG.','').replace('OTM.','');
              const cx=n.complexity_score!=null?n.complexity_score:null;
              const cxC=cx==null?C.faint:cx<=20?'#22C55E':cx<=50?'#F59E0B':'#EF4444';
              return h('div',{key:n.agent_gid,
                onClick:()=>this.smOpenAgent(n.agent_gid),
                onMouseEnter:()=>this.setState({skymfgMapHovered:n.agent_gid}),
                onMouseLeave:()=>this.setState({skymfgMapHovered:null}),
                style:{position:'absolute',left:pos.x,top:pos.y,width:NW,
                  padding:'0',
                  background:'#fff',
                  border:'1px solid '+(isH?dc:'#E2E8F0'),
                  borderRadius:8,cursor:'pointer',
                  boxShadow:isH
                    ?'0 4px 16px '+dc+'55,0 0 0 2px '+dc+'33'
                    :isDim?'none':'0 1px 4px rgba(0,0,0,.06)',
                  opacity:isDim?0.32:1,
                  transition:'opacity 120ms,box-shadow 80ms',
                  userSelect:'none',overflow:'hidden'}},
                // Top color bar
                h('div',{style:{height:3,background:dc}}),
                // Link count badge — top right corner
                n.link_count?h('div',{style:{position:'absolute',top:5,right:6,
                  width:17,height:17,borderRadius:'50%',
                  background:'#F97316',display:'flex',alignItems:'center',justifyContent:'center',
                  fontSize:9,fontWeight:800,color:'#fff',lineHeight:1,zIndex:1}},n.link_count):null,
                // Card body
                h('div',{style:{padding:'7px 10px 8px'}},
                  // Agent name
                  h('div',{style:{fontSize:11,fontWeight:700,color:'#1E293B',
                    lineHeight:1.25,marginBottom:5,
                    paddingRight:n.link_count?16:0,
                    overflow:'hidden',display:'-webkit-box',
                    WebkitLineClamp:2,WebkitBoxOrient:'vertical'}},n.agent_xid),
                  // DQT / event row
                  dqtShort?h('div',{style:{fontSize:9,fontWeight:700,color:dc,
                    fontFamily:'JetBrains Mono,monospace',marginBottom:3,
                    overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},dqtShort):null,
                  // Score + version + health dot
                  h('div',{style:{display:'flex',alignItems:'center',gap:4,marginBottom:4}},

        h('div',{style:{maxHeight:120,overflowY:'auto',border:'1px solid '+C.border,borderRadius:6,
          background:C.panel2+'80',padding:'8px 10px'}},

                onMouseEnter:e=>{e.currentTarget.style.background=dc+'22';},
                onMouseLeave:e=>{e.currentTarget.style.background=dc+'12';}},n.agent_xid);})))):null);
  }

  renderSkymfgList(){ const C=this.C,h=React.createElement;
    const {skymfgListSearch:q,skymfgListDomains:fDom,skymfgListDQTs:fDQT,
           skymfgListActiveOnly:activeOnly,skymfgListSort:sc,skymfgListSortDir:sd,
           skymfgListLinkedOnly:linkedOnly,skymfgListLinkData:ld}=this.state;
    const doms=this.skymfgDomains||[];
    const allDQTs=[...new Set((this.skymfgAgents||[]).map(a=>a.data_query_type_gid))].sort();

    // Lazy-load tier-1 link graph for counts (domain-agnostic, all agents)
    if(!ld&&!this._listLinkLoading){
      this._listLinkLoading=true;
      this._fetchLinkGraph(null,1).then(g=>{this._listLinkLoading=false;this.setState({skymfgListLinkData:g});});
    }
    // Build per-agent trigger/triggered-by count maps from edges
    const trigC={},trigByC={};
    if(ld&&ld.edges){
      ld.edges.forEach(e=>{trigC[e.source]=(trigC[e.source]||0)+1;trigByC[e.target]=(trigByC[e.target]||0)+1;});
    }

    let agents=this.smFilteredAgents();
    if(q){ const ql=q.toLowerCase(); agents=agents.filter(a=>a.agent_xid.toLowerCase().includes(ql)||a.agent_gid.toLowerCase().includes(ql)); }
    if(fDom.length) agents=agents.filter(a=>fDom.includes(a.domain_name));
    if(fDQT.length) agents=agents.filter(a=>fDQT.includes(a.data_query_type_gid));
    if(activeOnly) agents=agents.filter(a=>a.is_active);
    if(linkedOnly) agents=agents.filter(a=>(trigC[a.agent_gid]||0)+(trigByC[a.agent_gid]||0)>0);
    agents=[...agents].sort((a,b)=>{
      let av=sc==='trigger_count'?(trigC[a.agent_gid]||0):sc==='triggered_by_count'?(trigByC[a.agent_gid]||0):a[sc];
      let bv=sc==='trigger_count'?(trigC[b.agent_gid]||0):sc==='triggered_by_count'?(trigByC[b.agent_gid]||0):b[sc];
      if(typeof av==='string') av=av.toLowerCase(); if(typeof bv==='string') bv=bv.toLowerCase();
      return av<bv?(sd==='asc'?-1:1):av>bv?(sd==='asc'?1:-1):0; });

            style:{font:'inherit',fontSize:12,border:'none',background:'transparent',outline:'none',flex:1,color:C.text}})),
        h('select',{value:fDom[0]||'',onChange:e=>{const v=e.target.value;this.setState({skymfgListDomains:v?[v]:[]});},
          style:{font:'inherit',fontSize:11,padding:'5px 8px',borderRadius:6,border:'1px solid '+C.border,background:C.panel2,color:C.text,cursor:'pointer'}},
          h('option',{value:''},'All Domains'),...doms.map(d=>h('option',{key:d.domain_name,value:d.domain_name},d.display_label))),

  // ─── IMPORT helpers ──────────────────────────────────────────────────────────
  _runImportParse(){
    this.setState({importRunning:true});
    setTimeout(()=>{
      let src=this.agents;
      const ft=this.state.importFilterType, fv=(this.state.importFilterVal||'').toLowerCase();
      if(ft==='domain'&&fv) src=src.filter(a=>a.domain.toLowerCase().includes(fv));
      else if(ft==='pattern'&&fv) src=src.filter(a=>(a.id+' '+a.name).toLowerCase().includes(fv));
      const synth=[
        {id:'AG-SHIP-PRECHECK',name:'Pre-Shipment Readiness Check',domain:'Shipment Execution',type:'Compliance',steps:4,parseStatus:'clean',isNew:true,rawConfig:null,warningMsg:null},
        {id:'AG-ORD-TAXCALC',name:'Tax & Duty Calculator',domain:'Order Management',type:'Rating',steps:6,parseStatus:'clean',isNew:true,rawConfig:null,warningMsg:null}
      ];
      const parsed=[...synth,...src.map(a=>{
        const steps=(a.conditions||[]).length+(a.actions||[]).length;
        if(a.id==='AG-AI-CARRIERRANK') return {...a,steps,parseStatus:'failed',isNew:false,
          rawConfig:'<AgentPkg id="AG-AI-CARRIERRANK">\n  <Trigger>CARRIER_SCORE_READY</Trigger>\n  <Action>UPDATE NULL CARRIER_GID\n    WHERE SCORE > @threshold\n  -- ERROR: unresolved ref @threshold (line 4)\n  </Action>\n</AgentPkg>',
          warningMsg:'Unresolved parameter reference: @threshold (line 4)'};
        if(a.id==='AG-INV-FRTAUDIT') return {...a,steps,parseStatus:'warnings',isNew:false,rawConfig:null,
          warningMsg:'Deprecated syntax: FREIGHT_BILL.audit_flag → use FRGHT_BILL.audit_required'};
        return {...a,steps,parseStatus:'clean',isNew:false,rawConfig:null,warningMsg:null};
      })];
      const actions={};
      parsed.forEach(p=>{actions[p.id]=p.parseStatus==='failed'?'skip':p.isNew?'create':'overwrite';});
      this.setState({importParsed:parsed,importActions:actions,importRunning:false,importStep:2});
    },1600);
  }
  async _runImport(){
    const parsed=this.state.importParsed||[], actions=this.state.importActions||{};
    this.setState({importRunning:true});
    const created=parsed.filter(p=>actions[p.id]==='create').length;
    const updated=parsed.filter(p=>actions[p.id]==='overwrite').length;
    const skipped=parsed.filter(p=>actions[p.id]==='skip').length;
    const failed=parsed.filter(p=>p.parseStatus==='failed').length;
    await new Promise(r=>setTimeout(r,1800));
    const env=this.state.importEnv||'PROD';
    const srcLabel={otm:'Live OTM Connection',upload:'Config Upload',git:'Repository Sync'}[this.state.importSource||'otm'];
    await this._addAuditEntry('Agent Import','Import via '+srcLabel,'OK','teal',created+' new · '+updated+' updated · '+skipped+' skipped · '+failed+' failed · env: '+env);
    this.setState({importRunning:false,importDone:true,importStep:4});
  }

  // ─── AGENT VIEW helpers ───────────────────────────────────────────────────────
  _agentSummary(id){ const m={'AG-ORD-RATESVC':'Evaluates released orders against contracted rate tables and emits RATE_APPLIED, unblocking downstream shipment planning.','AG-ORD-CREDITHOLD':'Intercepts order release when credit exposure exceeds tolerance — places a HELD status and notifies AR before any shipment is created.','AG-SHIP-AUTOTENDER':'Selects the optimal carrier from ranked results and issues a tender, advancing the shipment from PLANNED to TENDERED state.','AG-SHIP-TENDERRESP':'Monitors carrier acknowledgments on open tenders and routes acceptances to booking confirmation or declines to re-tender logic.','AG-SHIP-RETENDER':'Handles declined or timed-out tenders by selecting an alternate carrier and re-issuing with configurable retry limits and escalation.','AG-SHIP-DOCGEN':'Generates and attaches BOL, packing list, and customs documents to a confirmed shipment, writing document GIDs back to ORDER_GID.','AG-SHIP-TRACKUPDATE':'Ingests carrier milestone events and updates shipment status, ETA, and stop progress in real time against the OTM shipment record.','AG-INV-AUTOAPPROVE':'Auto-approves freight invoices that match contracted rates within tolerance, bypassing manual review for clean bills.','AG-INV-FRTAUDIT':'Audits high-value or flagged freight bills against rate agreements and compliance rules, routing exceptions to the dispute queue.','AG-INV-VARIANCE':'Calculates charge variances between billed and expected amounts, categorising and escalating outliers above configurable thresholds.','AG-AI-DWELL':'Predicts dwell time at each stop using a trained model on historical carrier and location data, feeding downstream capacity planning.','AG-AI-CARRIERRANK':'Scores and ranks available carriers per lane using AI-weighted factors (on-time, cost, capacity), surfacing the ranked list to auto-tender.'};
    return m[id]||'Processes events in the '+(this.byId(id)||{domain:'OTM'}).domain+' workflow domain.'; }

  _agentSql(a){ const r=(a.reads||[]).slice(0,4).join(',\n       ')||'SHIPMENT_GID';
    const w=(a.writes||[]).slice(0,2);
    const conds=(a.conditions||[]).slice(0,2).map(c=>'  AND  '+c).join('\n');
    const setLines=w.length?w.map((f,i)=>(i===0?'    ':'    ')+f+' = '+(i===0?':new_'+f.toLowerCase().replace(/[^a-z0-9]/g,'_'):'NOW()')).join(',\n'):'    STATUS = :status';
    return '-- '+a.id+'  |  trigger: '+a.evt+'\n-- Read phase\nSELECT '+r+'\nFROM   OTM.SHIPMENT_B s\n  JOIN OTM.SHIPMENT_STOP_D d ON d.SHIPMENT_GID = s.SHIPMENT_GID\nWHERE  s.DOMAIN_NAME = :domain\n'+conds+';\n\n-- Write-back after execution\nUPDATE OTM.SHIPMENT_B\nSET\n'+setLines+'\nWHERE  SHIPMENT_GID = :shipment_gid\n  AND  DOMAIN_NAME  = :domain;'; }

  _highlightSql(sql){ let h=sql.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    h=h.replace(/(--[^\n]*)/g,'<span style="color:#9CA3A3;font-style:italic">$1</span>');
    h=h.replace(/\b(SELECT|FROM|JOIN|LEFT|RIGHT|INNER|ON|WHERE|AND|OR|NOT|UPDATE|SET|INSERT|INTO|DELETE|AS|GROUP|BY|ORDER|HAVING|DISTINCT|NULL|IS|IN|COUNT|SUM|WITH)\b/g,'<span style="color:#2C5EA8;font-weight:700">$1</span>');
    h=h.replace(/(:[\w_]+)/g,'<span style="color:#1E9A8A">$1</span>');
    h=h.replace(/'([^']*)'/g,'<span style="color:#C07B0A">\'$1\'</span>');
    return h; }

  _agentDeps(a){ const connected=[],seen=new Set();
    [...(this.flowEdges||[]),...(this.aiEdges||[])].forEach(e=>{
      const [f,t]=e;
      if(f===a.id&&!seen.has('o:'+t)){seen.add('o:'+t);connected.push({id:t,dir:'out'});}
      if(t===a.id&&!seen.has('i:'+f)){seen.add('i:'+f);connected.push({id:f,dir:'in'});}
    });
    const allText=[...(a.conditions||[]),...(a.actions||[]),...(a.reads||[]),...(a.writes||[])].join(' ');
    const refnums=[...new Set((allText.match(/\b\w+(?:_GID|_STATUS|_FLAG|_REASON|_FORECAST|FREIGHT_BILL)\b/g)||[]))];
    const sqlObjs=['OTM.SHIPMENT_B','OTM.SHIPMENT_STOP_D'];
    if(a.domain==='Order Management') sqlObjs.unshift('OTM.ORDER_BASE_B');
    if(a.domain==='Invoice & Finance') sqlObjs.push('OTM.INVOICE_D','OTM.FREIGHT_BILL');
    if(a.type==='AI') sqlObjs.push('AI_MODEL.'+a.id.replace('AG-','').replace(/-/g,'_'));
    return {connected,refnums,sqlObjs}; }

  // ─── QUICK VIEW MODAL ──────────────────────────────────────────────────────
  // ─── BLAST RADIUS ENGINE ──────────────────────────────────────────────────
  _computeBlast(kind, value){
    // Build inverted indexes
    const fieldReaders={}, fieldWriters={}, evtListeners={}, downstream={};
    this.agents.forEach(a=>{
      (a.reads||[]).forEach(f=>{ fieldReaders[f]=fieldReaders[f]||new Set(); fieldReaders[f].add(a.id); });
      (a.writes||[]).forEach(f=>{ fieldWriters[f]=fieldWriters[f]||new Set(); fieldWriters[f].add(a.id); });
      evtListeners[a.evt]=evtListeners[a.evt]||new Set(); evtListeners[a.evt].add(a.id);
    });
    [...(this.flowEdges||[]),...(this.aiEdges||[])].forEach(([f,t])=>{
      downstream[f]=downstream[f]||[]; downstream[f].push(t);
    });

    // Seed: direct targets
    const seeds=new Set();
    if(kind==='field'){
      (fieldReaders[value]||new Set()).forEach(id=>seeds.add(id));
      (fieldWriters[value]||new Set()).forEach(id=>seeds.add(id));
    } else if(kind==='event'){
      (evtListeners[value]||new Set()).forEach(id=>seeds.add(id));
    } else if(kind==='agent'){
      (downstream[value]||[]).forEach(id=>seeds.add(id));
      const a=this.byId(value);
      if(a)(a.writes||[]).forEach(f=>(fieldReaders[f]||new Set()).forEach(id=>{if(id!==value)seeds.add(id);}));
    } else if(kind==='domain'){
      const mine=this.agents.filter(a=>a.domain===value).map(a=>a.id);
      mine.forEach(aid=>(downstream[aid]||[]).forEach(id=>{if(!mine.includes(id))seeds.add(id);}));
      mine.forEach(id=>seeds.add(id));
    }

    // BFS for transitive impact
    const hops={};
    const queue=[...seeds].map(id=>({id,hop:1}));
    seeds.forEach(id=>{ hops[id]=1; });
    while(queue.length){
      const {id,hop}=queue.shift();
      (downstream[id]||[]).forEach(next=>{ if(hops[next]===undefined){ hops[next]=hop+1; queue.push({id:next,hop:hop+1}); } });
      const ag=this.byId(id);
      if(ag)(ag.writes||[]).forEach(f=>(fieldReaders[f]||new Set()).forEach(next=>{
        if(next!==id&&hops[next]===undefined){ hops[next]=hop+1; queue.push({id:next,hop:hop+1}); }
      }));
    }

    const affected=Object.entries(hops)
      .filter(([id])=>kind!=='agent'||id!==value)
      .map(([id,hop])=>({agent:this.byId(id),hop}))
      .filter(r=>r.agent)
      .sort((a,b)=>a.hop-b.hop||a.agent.domain.localeCompare(b.agent.domain));

    const direct=affected.filter(r=>r.hop===1);
    const indirect=affected.filter(r=>r.hop>1);
    const domains=[...new Set(affected.map(r=>r.agent.domain))];
    const affIds=new Set(affected.map(r=>r.agent.id));
    const processesAtRisk=(this.jobs||[]).filter(j=>affected.some(r=>j.name&&r.agent.domain&&j.name.toLowerCase().includes(r.agent.domain.toLowerCase().split(' ')[0].toLowerCase())));
    const critCount=affected.filter(r=>r.agent.priority==='Critical').length;
    return {direct,indirect,domains,processesAtRisk,critCount,total:affected.length};
  }

  _exportBlastReport(result,kind,value,label){
    const lines=['# Impact Analysis: '+label,'','**Type:** '+kind+'  |  **Object:** '+value,'',
      '| Metric | Value |','|---|---|',
      '| Total agents affected | '+result.total+' |',
      '| Domains crossed | '+result.domains.length+' |',
      '| Critical-priority agents | '+result.critCount+' |',
      '| Processes at risk | '+result.processesAtRisk.length+' |',''];
    if(result.direct.length){
      lines.push('## Direct impact (hop 1)','');
      lines.push('| Agent | Domain | Type | Health |','|---|---|---|---|');
      result.direct.forEach(r=>lines.push('| '+r.agent.id+' | '+r.agent.domain+' | '+r.agent.type+' | '+r.agent.health+' |'));
      lines.push('');
    }
    if(result.indirect.length){
      lines.push('## Cascades (hop 2+)','');
      lines.push('| Agent | Domain | Type | Hop |','|---|---|---|---|');
      result.indirect.forEach(r=>lines.push('| '+r.agent.id+' | '+r.agent.domain+' | '+r.agent.type+' | '+r.hop+' |'));
      lines.push('');
    }
    if(result.processesAtRisk.length){
      lines.push('## Processes at risk','');
      result.processesAtRisk.forEach(p=>lines.push('- '+p.name));
      lines.push('');
    }
    this.download('blast-radius-'+value.replace(/[^a-z0-9]/gi,'_').toLowerCase()+'.md',lines.join('\n'),'text/markdown');
  }

  renderBlastPanel(){ const C=this.C,h=React.createElement;
    const bt=this.state.blastTarget; if(!bt) return null;
    const close=()=>this.setState({blastTarget:null});
    const result=this._computeBlast(bt.kind,bt.value);
    const kindLabel={field:'Field / GID',event:'Event',agent:'Agent',domain:'Domain'}[bt.kind]||bt.kind;
    const kindCol={field:C.teal,event:C.purple,agent:C.red,domain:C.gold}[bt.kind]||C.dim;

    const bigNum=(n,label,col)=>h('div',{style:{flex:1,background:col+'0D',border:'1px solid '+col+'28',borderRadius:10,padding:'10px 12px',textAlign:'center',minWidth:70}},
      h('div',{style:{fontSize:22,fontWeight:700,color:col,lineHeight:1,fontFamily:'JetBrains Mono,monospace'}},n),
      h('div',{style:{fontSize:10,color:C.dim,marginTop:3,fontWeight:500}},label));

    const agRow=(r,i,last)=>{
      const a=r.agent; const tc=this.typeColor(a.type);
      return h('div',{key:a.id,style:{display:'flex',alignItems:'center',gap:8,padding:'7px 0',borderBottom:last?'none':'1px solid '+C.line}},
        h('span',{style:{width:3,height:28,borderRadius:2,background:tc,flex:'none'}}),
        h('div',{style:{flex:1,minWidth:0}},
          h('div',{style:{fontSize:11.5,fontWeight:600,color:C.text,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},a.name),
          h('div',{style:{fontSize:10,color:C.faint,fontFamily:'JetBrains Mono,monospace',marginTop:1}},a.domain+' · '+a.id)),
        r.hop>1?h('span',{style:{fontSize:9,fontFamily:'JetBrains Mono,monospace',color:C.dim,background:C.panel2,border:'1px solid '+C.border,borderRadius:3,padding:'1px 5px',flex:'none'}},'hop '+r.hop):null,
        this.healthPill(a.health),
        h('button',{onClick:()=>{close();this.chooseAgent(a.id,{screen:'view'});},
          style:{background:'transparent',border:'1px solid '+C.border,borderRadius:5,cursor:'pointer',color:C.dim,fontSize:10,padding:'1px 7px',font:'inherit',flex:'none'}},'→')); };

    const section=(title,col,rows)=>rows.length===0?null:h('div',{style:{marginBottom:14}},
      h('div',{style:{fontSize:9.5,fontWeight:700,color:col,textTransform:'uppercase',letterSpacing:'.6px',marginBottom:6,paddingBottom:4,borderBottom:'1px solid '+C.line}},title+' ('+rows.length+')'),
      rows.map((r,i)=>agRow(r,i,i===rows.length-1)));

    return h('div',{style:{position:'fixed',right:0,top:0,bottom:0,width:360,background:C.panel,
        borderLeft:'1px solid '+C.border,boxShadow:'-4px 0 32px rgba(45,51,51,.14)',
        zIndex:900,display:'flex',flexDirection:'column',animation:'slidein .2s cubic-bezier(.2,.8,.2,1)'}},
      h('div',{style:{padding:'14px 16px',borderBottom:'1px solid '+C.border,display:'flex',alignItems:'center',gap:10,flex:'none',background:C.panel2}},
        h('span',{style:{fontSize:9.5,fontWeight:700,fontFamily:'JetBrains Mono,monospace',background:kindCol+'18',border:'1px solid '+kindCol+'40',borderRadius:4,padding:'2px 7px',color:kindCol,flex:'none'}},kindLabel),
        h('div',{style:{flex:1,minWidth:0}},
          h('div',{style:{fontSize:13,fontWeight:700,color:C.text,fontFamily:'JetBrains Mono,monospace',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},bt.label),
          h('div',{style:{fontSize:10,color:C.faint,marginTop:1}}, 'Impact analysis')),
        h('button',{onClick:close,style:{background:'transparent',border:'none',cursor:'pointer',color:C.faint,fontSize:20,padding:'2px 6px',borderRadius:6,font:'inherit',lineHeight:1}},'×')),
      h('div',{style:{padding:'14px 16px',borderBottom:'1px solid '+C.border,flex:'none'}},
        result.total===0
          ? h('div',{style:{fontSize:13,color:C.faint,textAlign:'center',padding:'8px 0'}},'No agents affected ✓')
          : h('div',{},
              result.critCount>0?h('div',{style:{display:'flex',alignItems:'center',gap:7,fontSize:12,color:C.red,fontWeight:600,marginBottom:10,background:C.red+'0D',border:'1px solid '+C.red+'28',borderRadius:7,padding:'7px 10px'}},
                h('span',{},'⚠'),result.critCount+' critical-priority agent'+(result.critCount>1?'s':'')+' in blast radius'):null,
              h('div',{style:{display:'flex',gap:8}},
                bigNum(result.total,'Agents',kindCol),
                bigNum(result.domains.length,'Domains',C.navy),
                bigNum(result.processesAtRisk.length,'Processes',C.gold)))),
      result.total===0?null:h('div',{style:{flex:1,overflowY:'auto',padding:'12px 16px'}},
        section('Direct — reads or triggers on this object',kindCol,result.direct),
        section('Cascades — downstream via dependency chain',C.dim,result.indirect),
        result.processesAtRisk.length?h('div',{style:{marginBottom:14}},
          h('div',{style:{fontSize:9.5,fontWeight:700,color:C.gold,textTransform:'uppercase',letterSpacing:'.6px',marginBottom:6,paddingBottom:4,borderBottom:'1px solid '+C.line}},'Processes at risk ('+result.processesAtRisk.length+')'),
          result.processesAtRisk.map((p,i)=>h('div',{key:i,style:{display:'flex',alignItems:'center',gap:8,padding:'5px 0',borderBottom:i<result.processesAtRisk.length-1?'1px solid '+C.line:'none'}},
            h('span',{style:{width:8,height:8,borderRadius:'50%',background:p.status==='green'?'#1A8C5C':p.status==='red'?C.red:'#D97706',flex:'none'}}),
            h('span',{style:{fontSize:11.5,color:C.text,flex:1}},p.name)))):null),
      h('div',{style:{padding:'12px 16px',borderTop:'1px solid '+C.border,flex:'none',display:'flex',gap:8,background:C.panel2}},
        h('button',{onClick:()=>{this._exportBlastReport(result,bt.kind,bt.value,bt.label);this.toast('Downloaded blast radius report');},
          style:{flex:1,cursor:'pointer',font:'inherit',fontSize:12,fontWeight:600,color:C.dim,background:C.panel,
            border:'1px solid '+C.border,borderRadius:8,padding:'8px 0'}}, 'Export report'),
        h('button',{onClick:()=>{close();this.setState({screen:'workflow'});},
          style:{flex:1,cursor:'pointer',font:'inherit',fontSize:12,fontWeight:600,color:'#fff',background:kindCol,
            border:'none',borderRadius:8,padding:'8px 0'}}, 'View on map'))); }

  // ─── QUICK VIEW MODAL ──────────────────────────────────────────────────────
  renderQuickView(){ const C=this.C,h=React.createElement;
    const id=this.state.quickViewId; if(!id) return null;
    const a=this.byId(id); if(!a) return null;
    const tc=this.typeColor(a.type);
    const close=()=>this.setState({quickViewId:null});
    return h('div',{onClick:close,style:{position:'fixed',inset:0,background:'rgba(45,51,51,.5)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',padding:20}},
      h('div',{onClick:e=>e.stopPropagation(),style:{background:C.panel,borderRadius:16,width:600,maxHeight:'82vh',display:'flex',flexDirection:'column',boxShadow:'0 28px 80px rgba(45,51,51,.30)',border:'1px solid '+C.border,overflow:'hidden',animation:'toastin .18s cubic-bezier(.2,.8,.2,1)'}},
        h('div',{style:{display:'flex',alignItems:'center',gap:11,padding:'15px 20px',borderBottom:'1px solid '+C.border,flex:'none'}},
          h('span',{style:{width:4,height:30,borderRadius:2,background:tc,flex:'none'}}),
          h('div',{style:{flex:1,minWidth:0}},
            h('div',{style:{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}},
              h('span',{style:{fontSize:14,fontWeight:700,color:C.text}},a.name),this.healthPill(a.health),this.pill(a.type,tc),this.mono(a.version,C.faint,11)),
            h('div',{style:{fontSize:11,color:C.faint,marginTop:2,fontFamily:'JetBrains Mono,monospace'}},a.domain+' · '+a.id)),
          h('button',{onClick:close,style:{background:'transparent',border:'none',cursor:'pointer',color:C.faint,fontSize:20,padding:'2px 6px',borderRadius:6,font:'inherit',lineHeight:1}},'×')),
        h('div',{style:{padding:'10px 20px',background:C.purple+'06',borderBottom:'1px solid '+C.border,flex:'none',fontSize:12.5,color:C.dim,lineHeight:1.65}},
          h('span',{style:{fontSize:9.5,fontWeight:700,color:C.purple,fontFamily:'JetBrains Mono,monospace',background:C.purple+'15',border:'1px solid '+C.purple+'30',borderRadius:4,padding:'1px 6px',marginRight:8}},'✦ AI'),
          this._agentSummary(id)),
        h('div',{style:{flex:1,overflowY:'auto',padding:'14px 20px'}},
          this._renderStepList(a,null,()=>{},true),
          h('div',{style:{marginTop:16,paddingTop:14,borderTop:'1px solid '+C.line}},
            this.renderAnnotationsPanel(id,{compact:true,onNavigate:()=>{close();this.chooseAgent(id,{screen:'view'});}}))),
        h('div',{style:{padding:'12px 20px',borderTop:'1px solid '+C.border,display:'flex',gap:8,justifyContent:'flex-end',flex:'none',background:C.panel2}},
          this.btn('⬡ Blast radius',{onClick:()=>{close();this.setState({blastTarget:{kind:'agent',value:id,label:a.name}});}}),
          this.btn('Promotion Diff',{onClick:()=>{close();this.chooseAgent(id,{screen:'agents'});}}),
          this.btn('Open full view',{onClick:()=>{close();this.chooseAgent(id,{screen:'view'});}}),
          this.btn('Agent Editor',{primary:true,onClick:()=>{close();this.chooseAgent(id,{screen:'workbench'});}}))));  }

  renderVals(){
    const o=[this.renderBlastPanel(),this.renderQuickView()].filter(Boolean);
    const overlay=o.length===0?null:o.length===1?o[0]:React.createElement(React.Fragment,{},o[0],o[1]);
    return { nav:this.renderNav(), topbar:this.renderTopbar(), view:this.renderView(), toast:this.renderToast(), overlay }; }
}
</script>
</body>
</html>
