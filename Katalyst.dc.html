<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#FCFAF7}
body{font-family:"Oracle Sans",Inter,ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;color:#423D38}
input,select,textarea,button{font-family:inherit;font-size:inherit}
input,select,textarea{border-radius:4px}
select option{background:#ffffff;color:#423D38;font-family:inherit}
:root{
  --rw-transition-fast:150ms cubic-bezier(.4,0,.2,1);
  --rw-transition:200ms cubic-bezier(.4,0,.2,1);
  --rw-transition-slow:300ms cubic-bezier(.4,0,.2,1);
  --rw-shadow-xs:0 1px 2px rgba(0,0,0,.06);
  --rw-shadow-sm:0 1px 3px rgba(0,0,0,.10),0 1px 2px rgba(0,0,0,.06);
  --rw-shadow-md:0 4px 12px rgba(0,0,0,.12);
  --rw-shadow-lg:0 20px 25px rgba(0,0,0,.10),0 8px 10px rgba(0,0,0,.04);
  --rw-radius-sm:4px;
  --rw-radius-md:8px;
  --rw-radius-lg:12px;
  --rw-radius-full:9999px;
  --cc-shell:rgba(26,50,112,0.96);
  --cc-shell-blur:blur(12px)
}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#C1BAB2;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#A09287}
::-webkit-scrollbar-track{background:transparent}
@keyframes flow{to{stroke-dashoffset:-18}}
@keyframes dashpan{to{stroke-dashoffset:-22}}
@keyframes toastin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes panelin{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:none}}
button:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:2px solid #1e56e0;outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:600px) and (orientation:portrait){
  [data-cat-rotate]{display:flex!important}
}
@media (max-width:860px){
  [data-cat-shell]{flex-direction:column!important;height:auto!important;min-height:100vh}
  [data-cat-side]{width:100%!important;height:auto!important;border-right:none!important;border-bottom:1px solid rgba(255,255,255,0.12)!important}
  [data-cat-side] [data-cat-logo]{display:none!important}
  [data-cat-nav]{flex-direction:row!important;flex-wrap:nowrap!important;overflow-x:auto!important;padding:8px!important}
  [data-cat-nav] [data-tier]{display:none!important}
  [data-cat-foot]{display:none!important}
  [data-cat-main]{height:auto!important}
  [data-cat-topbar]{flex-wrap:wrap!important;height:auto!important;padding:10px 16px!important;gap:10px}
}
</style>
</helmet>
<div data-cat-rotate style="display:none;position:fixed;inset:0;z-index:9999;background:#1a3270;color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:32px;font-family:inherit">
  <div style="font-size:52px;animation:spin 3s linear infinite;display:inline-block">↻</div>
  <div style="font-size:18px;font-weight:700;letter-spacing:.2px">Rotate to landscape</div>
  <div style="font-size:13px;opacity:.7;max-width:260px;line-height:1.6">Katalyst is a data-dense dashboard — landscape orientation gives you the full experience.</div>
</div>
<div data-cat-shell style="display:flex;height:100vh;width:100%;background:#FCFAF7;color:#423D38;overflow:hidden">
  <aside data-cat-side style="width:256px;flex:none;background:var(--cc-shell,rgba(26,50,112,0.96));backdrop-filter:var(--cc-shell-blur,blur(12px));-webkit-backdrop-filter:var(--cc-shell-blur,blur(12px));border-right:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;height:100vh;box-shadow:2px 0 12px rgba(0,0,0,0.18)">
    {{ nav }}
  </aside>
  <div data-cat-main style="flex:1;display:flex;flex-direction:column;min-width:0;height:100vh">
    <header data-cat-topbar style="height:64px;flex:none;border-bottom:1px solid #12245a;background:#1a3270;display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.22)">
      {{ topbar }}
    </header>
    <main style="flex:1;overflow:auto;padding:10px 12px;min-width:0;background:#FCFAF7">{{ view }}</main>
  </div>
  {{ toast }}
  {{ overlay }}
</div>
</x-dc>

  // ---------- helpers ----------
  componentDidMount(){
    this._evtInt=setInterval(()=>this.setState(s=>({evtTick:s.evtTick+1})),2200);
    this._loadData();
    const _qs=new URLSearchParams(window.location.search).get('screen');
    if(_qs&&_qs!==this.state.screen) this.go(_qs);
  }
  componentWillUnmount(){ clearInterval(this._evtInt); }

  async _loadData(){
    try {
      const [agentsRes,edgesRes,conflictsRes,auditRes,jobsRes,eventsRes,diffsRes,tracesRes,testsRes,annotRes,smSummaryRes,smDomainsRes,smAgentsRes,smIntegrationsRes,evtEdgesRes] = await Promise.all([
        fetch('/api/agents').then(r=>r.json()),
        fetch('/api/workflow-edges').then(r=>r.json()),
        fetch('/api/conflicts').then(r=>r.json()),
        fetch('/api/audit-log').then(r=>r.json()),
        fetch('/api/jobs').then(r=>r.json()),
        fetch('/api/live-events').then(r=>r.json()),
        fetch('/api/agent-diffs').then(r=>r.json()),
        fetch('/api/trace').then(r=>r.json()),
        fetch('/api/tests/AG-SHIP-RETENDER').then(r=>r.json()),
        fetch('/api/annotations').then(r=>r.json()).catch(()=>[]),
        fetch('/api/skymfg/summary').then(r=>r.json()).catch(()=>null),
        fetch('/api/skymfg/domains').then(r=>r.json()).catch(()=>[]),
        fetch('/api/skymfg/agents').then(r=>r.json()).catch(()=>[]),
        fetch('/api/skymfg/integrations').then(r=>r.json()).catch(()=>[]),
        fetch('/api/agents/event-edges').then(r=>r.json()).catch(()=>[]),
      ]);
      // agents
      this.agents = agentsRes.map(a=>({...a, success:parseFloat(a.success)||0, conditions:a.conditions||[], actions:a.actions||[], reads:a.reads||[], writes:a.writes||[]}));
      this.nwlAgents = this.agents.filter(a=>!a.domain||!a.domain.startsWith('SKYMFG'));
      // OTM event-based cross-agent connections (SkyMFG RAISE INTERNAL EVENT / RAISE EVENT)
      this.eventEdges = Array.isArray(evtEdgesRes)?evtEdgesRes.filter(e=>e.from_id&&e.to_id):[];
      // workflow edges
      this.flowEdges = edgesRes.filter(e=>e.edge_type==='flow').map(e=>[e.from_agent,e.to_agent]);
      this.aiEdges   = edgesRes.filter(e=>e.edge_type==='ai').map(e=>[e.from_agent,e.to_agent]);
      // conflicts — DB uses agent_a/agent_b; code uses a/b
      this.conflicts = conflictsRes.map(c=>({...c, a:c.agent_a, b:c.agent_b}));
      const conflictStatus={};
      conflictsRes.forEach(c=>{ conflictStatus[c.id]=c.status||'open'; });
      // audit — DB uses username; code uses user
      this.audit = auditRes.map(a=>({...a, user:a.username}));
      // jobs — DB uses last_run/duration; code uses last/dur
      this.jobs = jobsRes.map(j=>({...j, last:j.last_run, dur:j.duration}));
      // live events
      this.liveEventLog = eventsRes.map(e=>({...e, ok:e.ok===true||e.ok==='true'||e.ok==='t'}));
      // agent diffs — convert array to object keyed by agent id
      // Only overwrite the rich hardcoded agentDiffs when the DB contains at least
      // one record with actual diff rows — an all-empty result means the seed ran
      // without row data, and the built-in data should be preserved.
      if(diffsRes && diffsRes.some(d=>(d.rows||[]).length>0)){
        const agentDiffsObj={};
        diffsRes.forEach(d=>{ agentDiffsObj[d.id]={...d, rows:d.rows||[]}; });
        this.agentDiffs = agentDiffsObj;
      } // else: keep built-in agentDiffs class data (rows all empty in DB)
      // trace data — convert array to object keyed by agent_id; also set top-level trace for overview
      const traceDataObj={};
      tracesRes.forEach(t=>{
        const ag=this.agents.find(a=>a.id===t.agent_id);
        traceDataObj[t.agent_id]={...t, run:t.run_id, shipment:t.shipment_gid, total:t.total_ms, statusLabel:t.status_label, health:ag?.health||'green', steps:t.steps||[]};
      });
      this.traceData = traceDataObj;
      const retenderTrace=tracesRes.find(t=>t.agent_id==='AG-SHIP-RETENDER');
      if(retenderTrace) this.trace={run:retenderTrace.run_id, agent:retenderTrace.agent_id, shipment:retenderTrace.shipment_gid, env:retenderTrace.env, started:retenderTrace.started, total:retenderTrace.total_ms, steps:retenderTrace.steps||[]};
      // tests
      this.tests = testsRes.map(t=>({...t}));
      // annotations — group by agent_id
      const annotByAgent={};
      (annotRes||[]).forEach(a=>{ annotByAgent[a.agent_id]=annotByAgent[a.agent_id]||[]; annotByAgent[a.agent_id].push(a); });
      // skymfg data
      this.skymfgSummary      = smSummaryRes||null;
      this.skymfgDomains      = Array.isArray(smDomainsRes)?smDomainsRes:[];
      this.skymfgAgents       = Array.isArray(smAgentsRes)?smAgentsRes:[];
      this.skymfgIntegrations = Array.isArray(smIntegrationsRes)?smIntegrationsRes:[];
      this.setState({conflictStatus, _apiLoaded:true, _apiError:false, annotations:annotByAgent});
    } catch(e){
      console.error('[Katalyst] API load failed:',e);
      this.setState({_apiError:true});
    }
  }
  _retryLoad(){ this.setState({_apiError:false,_apiLoaded:false},()=>this._loadData()); }

  // ── Link data helpers (equivalent to useAgentLinks / useLinkGraph hooks) ────
  // Per-agent link cache: keyed by agent GID. Values: { data, ts } | 'loading'
  // Per-graph cache: keyed by `${domain||'*'}:${tier}`. Values: { data, ts }
  _linkCacheAgent = {};
  _linkCacheGraph  = {};
  static _LINK_TTL = 120_000; // 2 min

  // useAgentLinks(agentGid) — fetches GET /api/agents/:agentGid/links with cache
  // Returns a promise that resolves to { triggers, triggered_by, peers, shared_systems, counts }
  async _fetchAgentLinks(agentGid) {
    if (!agentGid) return null;
    const cached = this._linkCacheAgent[agentGid];
    if (cached && Date.now() - cached.ts < KatalystApp._LINK_TTL) return cached.data;
    // Prevent concurrent double-fetches for the same agent
    if (cached === 'loading') {
      return new Promise(res => setTimeout(() => res(this._fetchAgentLinks(agentGid)), 80));
    }
    this._linkCacheAgent[agentGid] = 'loading';
    try {
      const data = await fetch(`/api/agents/${encodeURIComponent(agentGid)}/links`).then(r => r.json());
      this._linkCacheAgent[agentGid] = { data, ts: Date.now() };
      return data;
    } catch (e) {
      delete this._linkCacheAgent[agentGid];
      console.warn('[links] fetchAgentLinks failed for', agentGid, e.message);
      return null;
    }
  }

  // useLinkGraph(domain?, tier?) — fetches GET /api/links/graph with cache
  // Returns a promise that resolves to { nodes, edges, stats }
  async _fetchLinkGraph(domain, tier = 1) {
    const key = `${domain||'*'}:${tier}`;
    const cached = this._linkCacheGraph[key];
    if (cached && Date.now() - cached.ts < KatalystApp._LINK_TTL) return cached.data;
    if (cached === 'loading') {
      return new Promise(res => setTimeout(() => res(this._fetchLinkGraph(domain, tier)), 80));
    }
    this._linkCacheGraph[key] = 'loading';
    try {
      const qs = new URLSearchParams({ tier });
      if (domain) qs.set('domain', domain);
      const data = await fetch(`/api/links/graph?${qs}`).then(r => r.json());
      this._linkCacheGraph[key] = { data, ts: Date.now() };
      return data;
    } catch (e) {
      delete this._linkCacheGraph[key];
      console.warn('[links] fetchLinkGraph failed', e.message);
      return null;
    }
  }

  // Invalidate link cache for a specific agent (call after agent edits)
  _invalidateLinkCache(agentGid) {
    if (agentGid) delete this._linkCacheAgent[agentGid];
    this._linkCacheGraph = {}; // graph may reference this agent
  }

  async _persistConflictStatus(id, status){
    try { await fetch('/api/conflicts/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,acknowledged_by:'admin'})}); } catch(e){ console.error(e); }
  }

  async _addAuditEntry(action, target, result, tone, note){
    const now=new Date(); const pad=n=>String(n).padStart(2,'0');
    const time=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+' '+pad(now.getHours())+':'+pad(now.getMinutes());
    const entry={time,username:'admin',action,target,env:this.state.env,result,tone,note:note||null};
    try {
      const res=await fetch('/api/audit-log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(entry)});
      if(res.ok){ const saved=await res.json(); this.audit=[{...saved,user:saved.username},...this.audit]; this.setState(s=>({evtTick:s.evtTick+1})); }
    } catch(e){ console.error(e); }
  }

  async _runPreflight(){
    const sel=this.state.envPromoteSelected||[];
    const source=this.state.envPromoteFrom||'TEST';
    const target=this.state.envPromoteTo||'PROD';
    this.setState({preflightLoading:true,preflightResult:null,preflightError:null});
    try {
      const res=await fetch('/api/v2/promotion/preflight',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({objects:sel,source,target})});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const pf=await res.json();
      this.setState({preflightResult:pf,preflightLoading:false});
    } catch(e){
      console.error('[preflight]',e);
      this.setState({preflightLoading:false,preflightError:'Preflight check failed: '+e.message,
        preflightResult:{verdict:'safe',counts:{blocking:0,warning:0,info:0,total:0},findings:[]}});
    }
  }

  async _runAgentQuery(q){

      queryHistory:[question,...(s.queryHistory||[]).filter(x=>x!==question)].slice(0,8)}));
    try{

        headers:{'Content-Type':'application/json'},body:JSON.stringify({question})});

  // Proper semver minor bump: v2.4.1 → v2.5.0  v0.9-beta → v0.10.0  v1.0.4-draft → v1.1.0
  bumpMinor(ver){
    const clean=(ver||'v0.1.0').replace(/^v/i,'').replace(/[-+][^\s.]*/,'');
    const parts=clean.split('.').map(n=>parseInt(n,10)).filter(n=>!isNaN(n));
    const major=parts[0]||0, minor=(parts[1]||0)+1;
    return 'v'+major+'.'+minor+'.0'; }

  // ── Annotation helpers ────────────────────────────────────────────────────
  _relTime(dt){
    if(!dt) return '';
    const diff=Date.now()-new Date(dt).getTime();
    const m=Math.floor(diff/60000);
    if(m<1) return 'just now';
    if(m<60) return m+'m ago';
    const hr=Math.floor(m/60);
    if(hr<24) return hr+'h ago';
    const d=Math.floor(hr/24);
    if(d<30) return d+'d ago';
    return Math.floor(d/30)+'mo ago';
  }

  // Build aligned diff rows from two snapshot configs (same format as agent_diffs.rows)
  buildSnapshotRows(a, b){
    const rows=[];
    const pair=(ta,tb)=>rows.push({l:ta!=null?{t:'text',txt:ta}:{t:'none',txt:''},r:tb!=null?{t:'text',txt:tb}:{t:'none',txt:''}});
    // Fixed header fields — compare side-by-side
    pair('trigger: '+(a.evt||a.trigger||''), 'trigger: '+(b.evt||b.trigger||''));
    pair('version: '+(a.version_label||a.version||''), 'version: '+(b.version_label||b.version||''));
    pair('priority: '+(a.priority||''), 'priority: '+(b.priority||''));
    pair('success_rate: '+((a.success_rate??a.success??0))+'%', 'success_rate: '+((b.success_rate??b.success??0))+'%');
    pair('health: '+(a.health||''), 'health: '+(b.health||''));
    // Array sections: match by exact text, unmatched show as del/add
    const diffArr=(prefix,arrA,arrB)=>{
      const setA=new Set(arrA||[]), setB=new Set(arrB||[]);
      (arrA||[]).forEach(t=>{ const txt=prefix+': '+t; rows.push({l:{t:'text',txt}, r:setB.has(t)?{t:'text',txt}:{t:'none',txt:''}}); });
      (arrB||[]).forEach(t=>{ if(!setA.has(t)) rows.push({l:{t:'none',txt:''}, r:{t:'text',txt:prefix+': '+t}}); });
    };
    diffArr('condition', a.conditions, b.conditions);
    diffArr('action',    a.actions,    b.actions);
    diffArr('read',      a.reads,      b.reads);
    diffArr('write',     a.writes,     b.writes);
    return rows;
  }

  // Annotate raw rows with diff state (same output shape as computeDiff)
  computeSnapshotDiff(rawRows){
    let add=0,del=0,mod=0;
    const rows=rawRows.map(row=>{
      const lp=row.l.t!=='none', rp=row.r.t!=='none';
      if(lp&&rp){ if(row.l.txt===row.r.txt) return {l:{t:'same',txt:row.l.txt},r:{t:'same',txt:row.r.txt}}; mod++; return {l:{t:'mod',txt:row.l.txt},r:{t:'mod',txt:row.r.txt}}; }
      if(lp){ del++; return {l:{t:'del',txt:row.l.txt},r:{t:'none',txt:''}}; }
      if(rp){ add++; return {l:{t:'none',txt:''},r:{t:'add',txt:row.r.txt}}; }
      return row;
    });
    return {rows, summary:{add,del,mod}};
  }

  computeDiff(diff,envLeft,envRight){
    // Stored diff rows encode exactly two slots: l = PROD config, r = TEST config.
    // Any pair that doesn't span exactly PROD↔TEST cannot be resolved from this
    // static snapshot — returning garbled output is worse than an explicit signal.
    const EMPTY={rows:[],summary:{add:0,del:0,mod:0},warning:null,conflictId:null};

    if(envLeft===envRight)
      return {...EMPTY,insight:'Both sides target '+envLeft+' — configurations are identical.',unavailable:false};

    const isPT=(envLeft==='PROD'&&envRight==='TEST')||(envLeft==='TEST'&&envRight==='PROD');
    if(!isPT){
      const devEnv=[envLeft,envRight].find(e=>e==='DEV')||envLeft;
      return {...EMPTY,insight:null,unavailable:true,
        unavailableReason:'Static diff snapshots only capture PROD ↔ TEST. '
          +envLeft+' ↔ '+envRight+' requires a live connection to the '
          +devEnv+' OTM instance ('+this.envHost(devEnv)+'). '
          +'Use Admin → SSO to connect, or load a '+devEnv+' agent export via Import Agents.'}; }

    // PROD↔TEST pair — pick correctly regardless of left/right order.
    // row.l always holds PROD config; row.r always holds TEST config.
    const pick=(env,row)=>env==='PROD'?row.l:row.r;
    let add=0,del=0,mod=0;
    const rows=diff.rows.map(row=>{ const lc=pick(envLeft,row), rc=pick(envRight,row); const lp=lc.t!=='none', rp=rc.t!=='none';
      if(lp&&rp){ if(lc.txt===rc.txt) return {l:{t:'same',txt:lc.txt},r:{t:'same',txt:rc.txt}}; mod++; return {l:{t:'mod',txt:lc.txt},r:{t:'mod',txt:rc.txt}}; }
      if(lp&&!rp){ del++; return {l:{t:'del',txt:lc.txt},r:{t:'none',txt:''}}; }
      if(!lp&&rp){ add++; return {l:{t:'none',txt:''},r:{t:'add',txt:rc.txt}}; }
      return {l:{t:'none',txt:''},r:{t:'none',txt:''}}; });
    const has=add||del||mod;
    const insight=has?diff.insight:(envLeft+' and '+envRight+' are in sync — no changes to promote.');
    return {rows,summary:{add,del,mod},insight,warning:diff.warning,conflictId:diff.conflictId,unavailable:false}; }

  edgePath(a,b,bow){ const ax=a.gx+95, ay=a.gy+44, bx=b.gx+95, by=b.gy+44;
    const mx=(ax+bx)/2, my=(ay+by)/2; const dx=bx-ax, dy=by-ay; const len=Math.hypot(dx,dy)||1;
    const nx=-dy/len, ny=dx/len; const cx=mx+nx*bow, cy=my+ny*bow;
    return {d:'M'+ax+' '+ay+' Q'+cx+' '+cy+' '+bx+' '+by, mid:[cx*0.5+mx*0.5, cy*0.5+my*0.5]}; }

  // ── Phase 1: auto-discover field-level dependencies ────────────────────────
  _computeFieldEdges(){
    const norm=f=>f.replace(/\[\]$/,'');
    const wMap={};
    this.agents.forEach(a=>(a.writes||[]).forEach(f=>{const nf=norm(f);(wMap[nf]=wMap[nf]||[]).push(a.id);}));
    const edges=[];const seen=new Set();
    this.agents.forEach(reader=>{
      (reader.reads||[]).forEach(f=>{
        (wMap[norm(f)]||[]).forEach(wid=>{
          if(wid===reader.id)return;
          const k=wid+'→'+reader.id;
          if(!seen.has(k)){seen.add(k);edges.push({from:wid,to:reader.id,fields:[]});}
          edges.find(e=>e.from===wid&&e.to===reader.id).fields.push(norm(f));
        });
      });
    });
    return edges; }

  // ── Phase 2: ego-network layout for Focus mode ─────────────────────────────
  _focusLayout(focusId){
    if(!this._fieldEdgesCache) this._fieldEdgesCache=this._computeFieldEdges();
    const allEdges=[
      ...this.flowEdges.map(e=>({from:e[0],to:e[1]})),
      ...this.aiEdges.map(e=>({from:e[0],to:e[1]})),
      ...this._fieldEdgesCache.map(e=>({from:e.from,to:e.to})),
      ...(this.eventEdges||[]).map(e=>({from:e.from_id,to:e.to_id}))
    ];
    const dist={[focusId]:0};
    // Forward BFS: consumers (+1, +2)
    const fQ=[{id:focusId,d:0}];
    while(fQ.length){const {id,d}=fQ.shift();if(d>=2)continue;
      allEdges.filter(e=>e.from===id).forEach(e=>{if(dist[e.to]===undefined){dist[e.to]=d+1;fQ.push({id:e.to,d:d+1});}});}
    // Backward BFS: producers (-1, -2)
    const bQ=[{id:focusId,d:0}];
    while(bQ.length){const {id,d}=bQ.shift();if(d<=-2)continue;
      allEdges.filter(e=>e.to===id).forEach(e=>{if(dist[e.from]===undefined){dist[e.from]=d-1;bQ.push({id:e.from,d:d-1});}});}
    // Group by column (clamp ±2)
    const cols={'-2':[],'-1':[],'0':[focusId],'1':[],'2':[]};
    Object.entries(dist).forEach(([id,d])=>{if(id===focusId)return;
      const c=String(Math.max(-2,Math.min(2,d)));if(cols[c])cols[c].push(id);});
    // Column x positions: nodeW=190, colGap=54
    const NW=190,NH=88,NG=20,CG=54;
    const colX={'-2':30,'-1':30+NW+CG,'0':30+(NW+CG)*2,'1':30+(NW+CG)*3,'2':30+(NW+CG)*4};
    const CY=270;
    const pos={};
    Object.entries(cols).forEach(([c,ids])=>{if(!ids.length)return;
      const x=colX[Number(c)];const tot=ids.length*NH+(ids.length-1)*NG;const y0=CY-tot/2;
      ids.forEach((id,i)=>{pos[id]={x,y:y0+i*(NH+NG)};});});
    return {pos,dist,cols,colX}; }

  // ── Auto-layout for agents without hardcoded gx/gy (e.g. SkyMFG DB agents) ──
  _ensureAutoLayout(){
    if(this._autoLayoutPos) return;
    if(!this.agents?.length) return; // agents not yet loaded — don't cache
    const CU=214,RU=104,DG=80,COLS=4; // col-unit(190+24), row-unit(88+16), domain-gap, cols/domain
    const needLayout=this.agents.filter(a=>!a.gx&&!a.gy);
    if(!needLayout.length){this._autoLayoutPos={};return;}
    const byDomain={};
    needLayout.forEach(a=>{const d=a.domain||'Other';(byDomain[d]=byDomain[d]||[]).push(a);});
    Object.values(byDomain).forEach(arr=>arr.sort((a,b)=>(a.name||'').localeCompare(b.name||'')));
    const DOMAIN_ORDER=['SKYMFG/RAIL','SKYMFG/LW','SKYMFG','SKYMFG/TRAINING','SKYMFG/DEMO'];
    const domains=[...DOMAIN_ORDER.filter(d=>byDomain[d]),...Object.keys(byDomain).filter(d=>!DOMAIN_ORDER.includes(d))];
    const DOMS_PER_ROW=3,START_X=50,START_Y=700; // y=700 places SkyMFG below NWL (maxY≈588)
    const pos={};
    const row0Doms=domains.slice(0,DOMS_PER_ROW);

  renderDecisionTree(a){ const C=this.C,h=React.createElement;

    // ── Data contract computation ────────────────────────────────────────
    // Agents whose writes supply at least one field this agent reads
    const myReads=new Set(a.reads||[]);
    const deps=this.agents.filter(b=>b.id!==a.id&&(b.writes||[]).some(w=>myReads.has(w)));
    // Map each read field → the upstream agent that provides it
    const fieldProvider={};
    deps.forEach(b=>(b.writes||[]).forEach(w=>{ if(myReads.has(w)&&!fieldProvider[w]) fieldProvider[w]=b; }));
    const crossAgentFields=new Set(Object.keys(fieldProvider));
    // Downstream agents (what this agent's output flows into)
    const downFlow=this.flowEdges.filter(e=>e[0]===a.id).map(e=>this.byId(e[1])).filter(Boolean);
    const downAI  =this.aiEdges.filter(e=>e[0]===a.id).map(e=>this.byId(e[1])).filter(Boolean);
    const downstream=[...downFlow,...downAI];

    // ── Data contract chip helpers ───────────────────────────────────────

    // Row 1 — Listens to
    const listenRow=chipRow('Listens to',
      [chip(a.evt,C.teal+'14',C.teal)]);

    // Row 2 — Reads (cross-agent fields highlighted purple)
    const readChips=(a.reads||[]).map(r=>{
      const prov=fieldProvider[r];
      return prov
        ? chip(this.otmFieldIcon(r)+'↓ '+r,C.purple+'12',C.purple,'Provided by '+prov.id)
        : chip(this.otmFieldIcon(r)+'↓ '+r,C.navy+'0D',C.navy);

      h('rect',{x:rootCX-rootW/2,y:rootY,width:rootW,height:rootH,rx:10,fill:'#FFFFFF',stroke:tc,strokeWidth:2,style:{filter:'drop-shadow(0 2px 10px rgba(60,69,69,.12))'}}),
      h('rect',{x:rootCX-rootW/2,y:rootY,width:rootW,height:5,rx:2,fill:tc}),
      h('text',{x:rootCX,y:rootY+26,textAnchor:'middle',fontSize:13,fontWeight:700,fontFamily:'Inter,sans-serif',fill:C.text},this.truncate(a.name,26)),
      h('text',{x:rootCX,y:rootY+44,textAnchor:'middle',fontSize:10,fontFamily:'JetBrains Mono,monospace',fill:C.faint},a.id)
    );
    const vRoot=vln(rootCX,rootY+rootH,rootCX,jY);
    const hBar=vln(colW*0+colW/2,jY,colW*3+colW/2,jY);
    const allEls=cats.flatMap((cat,ci)=>{
      const cx=colW*ci+colW/2, catX=cx-catW/2, leafX=cx-leafW/2;
      const vc=vln(cx,jY,cx,catY,cat.color+'55');
      const catNode=h('g',{key:'cn'+ci},
        h('rect',{x:catX,y:catY,width:catW,height:catH,rx:8,fill:cat.color+'10',stroke:cat.color+'50',strokeWidth:1.5}),
        h('text',{x:cx,y:catY+catH/2+5,textAnchor:'middle',fontSize:11,fontWeight:700,fontFamily:'Inter,sans-serif',fill:cat.color},cat.label)
      );
      const vl=cat.items.length>0?vln(cx,catY+catH,cx,leafSY,cat.color+'30'):null;
      const leaves=cat.items.map((item,li)=>{
        const ly=leafSY+li*(leafH+leafGap);
        const txt=item.length>30?item.slice(0,29)+'…':item;
        return h('g',{key:'lf'+ci+'_'+li},
          h('rect',{x:leafX,y:ly,width:leafW,height:leafH,rx:6,fill:'#FFFFFF',stroke:C.border,strokeWidth:1,style:{filter:'drop-shadow(0 1px 2px rgba(60,69,69,.05))'}}),
          h('rect',{x:leafX,y:ly+1,width:3,height:leafH-2,rx:1,fill:cat.color+'70'}),
          h('text',{x:leafX+13,y:ly+leafH/2+4,fontSize:10,fontFamily:'JetBrains Mono,monospace',fill:C.dim},txt)
        );
      });
      return [vc,catNode,vl,...leaves];
    });

    return h('div',{style:{marginTop:16,background:C.panel,border:'1px solid '+C.border,borderRadius:12,padding:'18px 20px',boxShadow:'0 2px 12px rgba(60,69,69,.08)',animation:'panelin .2s ease'}},
      // ── Header bar ───────────────────────────────────────────────────
      h('div',{style:{display:'flex',alignItems:'center',gap:10,marginBottom:14,flexWrap:'wrap'}},
        h('span',{style:{width:4,height:28,borderRadius:2,background:tc,flex:'none'}}),
        h('span',{style:{fontSize:13.5,fontWeight:700,color:C.text}},a.name),
        this.pill(a.type,tc), this.healthPill(a.health), this.mono(a.version,C.faint,11),
        h('span',{style:{fontSize:12,color:C.dim,marginLeft:4}},'· owned by '+a.owner),
        this.annotBadge(a.id),
        h('div',{style:{marginLeft:'auto',display:'flex',alignItems:'center',gap:12}},
          h('button',{onClick:()=>this.setState({quickViewId:a.id,selectedNode:null}),style:this.linkBtn()},'Quick view'),
          h('span',{style:{color:this.C.border}},'·'),
          h('button',{onClick:e=>{e.stopPropagation();this.setState({blastTarget:{kind:'agent',value:a.id,label:a.name},selectedNode:null});},style:this.linkBtn()},'⬡ Blast radius'),
          h('span',{style:{color:this.C.border}},'·'),
          h('button',{onClick:()=>this.chooseAgent(a.id,{screen:'agents'}),style:this.linkBtn()},'Open diff →'),
          this.traceData[a.id]?h('button',{onClick:()=>this.chooseAgent(a.id,{screen:'trace'}),style:this.linkBtn()},'View replay →'):null,
          h('button',{onClick:()=>this.setState({selectedNode:null}),style:{background:'transparent',border:'none',cursor:'pointer',color:C.faint,fontSize:18,padding:'0 4px',borderRadius:4,font:'inherit'}},'×'))
      ),
      // ── OTM Data Contract ─────────────────────────────────────────────
      h('div',{style:{background:C.panel2,border:'1px solid '+C.border,borderRadius:8,padding:'4px 14px 2px',marginBottom:14}},
        h('div',{style:{display:'flex',alignItems:'center',gap:8,paddingBottom:6,paddingTop:4,borderBottom:'1px solid '+C.line}},
          h('span',{style:{fontSize:9.5,fontWeight:700,letterSpacing:'.8px',textTransform:'uppercase',
            color:C.faint,fontFamily:'JetBrains Mono,monospace'}},'OTM Data Contract'),
          crossAgentFields.size?h('span',{style:{fontSize:10,color:C.purple,fontFamily:'JetBrains Mono,monospace',
            background:C.purple+'0D',border:'1px solid '+C.purple+'28',borderRadius:3,padding:'1px 6px'}},
            '● '+crossAgentFields.size+' cross-agent field'+(crossAgentFields.size>1?'s':'')):null,
          deps.length?h('span',{style:{fontSize:10,color:C.amber,fontFamily:'JetBrains Mono,monospace',
            background:C.amber+'0D',border:'1px solid '+C.amber+'28',borderRadius:3,padding:'1px 6px'}},
            deps.length+' upstream dep'+(deps.length>1?'s':'')):null),
        listenRow, readRow, writeRow, emitRow, depRow),
      // ── Conflict callout ──────────────────────────────────────────────
      conflictCallout,
      // ── Decision tree SVG ─────────────────────────────────────────────
      h('div',{style:{overflowX:'auto',marginTop:conflictCallout?8:0}},
        h('svg',{viewBox:'0 0 '+W+' '+svgH,style:{width:'100%',minWidth:560,height:'auto',display:'block'},role:'img','aria-label':'Decision tree for '+a.name},
          rootEl,vRoot,hBar,...allEls.filter(x=>x)
        )
      ),
      h('div',{style:{borderTop:'1px solid '+C.border,padding:'14px 20px 8px',marginTop:4}},
        this.renderAnnotationsPanel(a.id,{compact:true,onNavigate:()=>this.chooseAgent(a.id,{screen:'view'})}))
    ); }

  // ── SkyMFG agent map panel (click on SkyMFG node) ────────────────────────
  _renderSkyMFGMapPanel(a){ const C=this.C,h=React.createElement;
    const col=this.domainColor(a.domain);
    const isAct=a.is_active==null?true:a.is_active;
    const evOut=(this.eventEdges||[]).filter(e=>e.from_id===a.id);
    const evIn=(this.eventEdges||[]).filter(e=>e.to_id===a.id);
    const smFull=(this.skymfgAgents||[]).find(x=>x.agent_gid===a.id);
    const stat=(label,val,sc)=>h('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',flex:1,padding:'8px 4px',borderRight:'1px solid '+C.line}},
      h('div',{style:{fontSize:15,fontWeight:700,color:sc||C.text,fontFamily:'JetBrains Mono,monospace'}},val??'—'),
      h('div',{style:{fontSize:7.5,color:C.faint,textTransform:'uppercase',letterSpacing:'.5px',marginTop:2,whiteSpace:'nowrap'}},label));
    const evRow=(e,dir)=>{
      const peer=this.byId(dir==='out'?e.to_id:e.from_id);
      return h('div',{key:e.event_gid+dir,style:{display:'flex',alignItems:'center',gap:6,padding:'4px 12px',borderBottom:'1px solid '+C.line+'55'}},
        h('span',{style:{fontSize:9,color:'#E67E22',fontWeight:700,flex:'none'}},dir==='out'?'↗':'↙'),
        h('span',{style:{fontFamily:'JetBrains Mono,monospace',fontSize:9,color:C.dim,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},e.event_gid||''),
        peer?h('button',{onClick:()=>this.setState({selectedNode:peer.id,wfFocusId:peer.id,wfMode:'focus'}),
          style:{font:'inherit',background:'transparent',border:'none',cursor:'pointer',color:C.teal,fontSize:8.5,padding:0,whiteSpace:'nowrap',textDecoration:'underline'}},
          this.truncate(peer.name||'',14)):null);
    };
    return h('div',{style:{width:308,flex:'none',borderLeft:'1px solid '+C.border,background:C.panel,display:'flex',flexDirection:'column',overflow:'hidden'}},
      // header
      h('div',{style:{background:col+'0D',borderBottom:'1px solid '+C.border,padding:'10px 14px 8px',flex:'none'}},
        h('div',{style:{display:'flex',alignItems:'flex-start',gap:6,marginBottom:4}},
          h('div',{style:{flex:1,minWidth:0}},
            h('div',{style:{fontSize:12.5,fontWeight:800,color:C.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},a.name),
            h('div',{style:{fontSize:8,fontFamily:'JetBrains Mono,monospace',color:C.faint,marginTop:2}},a.id)),
          h('span',{style:{fontSize:7.5,fontWeight:700,padding:'2px 7px',borderRadius:9999,background:col+'18',color:col,border:'1px solid '+col+'44',flex:'none',whiteSpace:'nowrap'}},(a.domain||'').replace('SKYMFG/','')),
          h('button',{onClick:()=>this.setState({selectedNode:null}),title:'Close',
            style:{width:22,height:22,border:'none',background:'transparent',borderRadius:6,cursor:'pointer',font:'inherit',fontSize:16,color:C.faint,display:'flex',alignItems:'center',justifyContent:'center',flex:'none',lineHeight:1,padding:0}},'×')),
        h('div',{style:{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}},
          h('span',{style:{display:'flex',alignItems:'center',gap:4,fontSize:10,fontWeight:700,color:isAct?'#1A8C5C':C.red}},
            h('span',{style:{width:6,height:6,borderRadius:'50%',background:isAct?'#1A8C5C':C.red,flex:'none'}}),
            isAct?'Active':'Inactive'),
          a.type?h('span',{style:{fontSize:9,fontFamily:'JetBrains Mono,monospace',color:C.dim}},a.type):null,
          (a.otm_release||smFull?.otm_release)?h('span',{style:{fontSize:9,fontFamily:'JetBrains Mono,monospace',color:C.faint}},a.otm_release||smFull?.otm_release):null)),
      // stats strip
      h('div',{style:{display:'flex',borderBottom:'1px solid '+C.border,flex:'none',background:C.panel2}},
        stat('Complexity',(a.complexity_score??smFull?.complexity_score),col),
        stat('NORMAL',(a.norm_action_count??smFull?.norm_action_count),C.teal),
        stat('ERROR',(a.err_action_count??smFull?.err_action_count),C.red),
        stat('Events',(a.event_count??smFull?.event_count),'#E67E22')),
      // body
      h('div',{style:{flex:1,overflowY:'auto',paddingBottom:8}},
        a.actions?.length?h('div',{},
          h('div',{style:{fontSize:8.5,fontWeight:800,color:C.faint,textTransform:'uppercase',letterSpacing:'.7px',padding:'7px 14px 4px',borderBottom:'1px solid '+C.line}},'Actions ('+a.actions.length+')'),
          h('div',{style:{padding:'4px 0'}},
            (a.actions||[]).slice(0,8).map((act,i)=>h('div',{key:i,style:{display:'flex',alignItems:'center',gap:6,padding:'3px 14px',borderBottom:'1px solid '+C.line+'40'}},
              h('span',{style:{fontSize:7.5,fontWeight:700,color:C.faint,fontFamily:'JetBrains Mono,monospace',minWidth:18,textAlign:'right'}},(i+1)+''),
              h('span',{style:{fontFamily:'JetBrains Mono,monospace',fontSize:9,color:C.dim}},this.truncate(act,32)))),
            a.actions.length>8?h('div',{style:{padding:'3px 14px',fontSize:9,color:C.faint}},'+' +(a.actions.length-8)+' more actions'):null)):null,
        h('div',{},
          h('div',{style:{fontSize:8.5,fontWeight:800,color:C.faint,textTransform:'uppercase',letterSpacing:'.7px',padding:'7px 14px 4px',borderBottom:'1px solid '+C.line}},'Event Connections ('+(evOut.length+evIn.length)+')'),
          (evOut.length||evIn.length)?h('div',{},...evOut.map(e=>evRow(e,'out')),...evIn.map(e=>evRow(e,'in'))):
            h('div',{style:{padding:'10px 14px',fontSize:11,color:C.faint,fontStyle:'italic'}},'No event connections')),
        h('div',{style:{padding:'10px 14px',borderTop:'1px solid '+C.border}},
          h('button',{onClick:()=>{ this.smOpenAgent(a.id); this.setState({selectedNode:null}); },
            style:{width:'100%',padding:'6px 0',borderRadius:8,border:'none',background:col,color:'#fff',
              fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}},
            'Open Full Detail →'))
      )
    ); }

  // ── agent detail panel ────────────────────────────────────────────────────
  _renderAgentDetailPanel(a){ const C=this.C,h=React.createElement;
    if(!a) return null;
    // SkyMFG agents get a dedicated panel instead of the NWL tree
    if(a.domain?.startsWith('SKYMFG')) return this._renderSkyMFGMapPanel(a);
    if(!this._fieldEdgesCache) this._fieldEdgesCache=this._computeFieldEdges();
    const fieldEdges=this._fieldEdgesCache;
    const tc=this.typeColor(a.type);
    const hc=this.healthColor(a.health);
    const PRIO_COL={Critical:C.red,High:C.amber,Medium:'#2C5EA8',Low:'#9CA3A3'};
    const prioCol=PRIO_COL[a.priority]||C.faint;

    // ── blast radius — forward BFS across all edge types ──────────────────
    const allBFSE=[...this.flowEdges.map(e=>({f:e[0],t:e[1]})),
      ...this.aiEdges.map(e=>({f:e[0],t:e[1]})),
      ...fieldEdges.map(e=>({f:e.from,t:e.to})),
      ...(this.eventEdges||[]).map(e=>({f:e.from_id,t:e.to_id}))];
    const vis=new Set([a.id]); const bfsQ=[a.id];
    while(bfsQ.length){const id=bfsQ.shift();
      allBFSE.forEach(e=>{if(e.f===id&&!vis.has(e.t)){vis.add(e.t);bfsQ.push(e.t);}});}
    const blastR=vis.size-1;

    // ── outbound events (events this agent causes in downstream agents) ────
    const outEvts=[...new Set([
      ...this.flowEdges.filter(e=>e[0]===a.id).map(e=>this.byId(e[1])?.evt),
      ...this.aiEdges.filter(e=>e[0]===a.id).map(e=>this.byId(e[1])?.evt)
    ].filter(Boolean))];

    // ── producers & consumers (union of flow + AI + field edges) ─────────
    const getFields=(fromId,toId)=>fieldEdges.filter(e=>e.from===fromId&&e.to===toId).flatMap(e=>e.fields);
    const producerIds=[...new Set([
      ...this.flowEdges.filter(e=>e[1]===a.id).map(e=>e[0]),
      ...this.aiEdges.filter(e=>e[1]===a.id).map(e=>e[0]),
      ...fieldEdges.filter(e=>e.to===a.id).map(e=>e.from)])];
    const consumerIds=[...new Set([
      ...this.flowEdges.filter(e=>e[0]===a.id).map(e=>e[1]),
      ...this.aiEdges.filter(e=>e[0]===a.id).map(e=>e[1]),
      ...fieldEdges.filter(e=>e.from===a.id).map(e=>e.to)])];

    // ── conflicts for this agent ──────────────────────────────────────────
    const myCfs=this.conflicts.filter(c=>c.a===a.id||c.b===a.id);

    // ── UI atoms ──────────────────────────────────────────────────────────
    const agLink=id=>{const ag=this.byId(id);if(!ag)return h('span',{style:{color:C.faint,fontSize:11}},id);
      return h('button',{key:id,onClick:()=>this.setState({wfFocusId:ag.id,wfMode:'focus',selectedNode:ag.id,wfPanX:0,wfPanY:0,wfZoom:0.79}),
        style:{font:'inherit',background:'transparent',border:'none',cursor:'pointer',padding:0,
          color:C.teal,fontWeight:600,fontSize:11.5,textAlign:'left',
          textDecoration:'underline',textDecorationStyle:'dotted',textDecorationColor:C.teal+'70'}},ag.name);};
    const evtPill=(evt,col)=>h('span',{style:{display:'inline-block',fontFamily:'JetBrains Mono,monospace',
      fontSize:9.5,fontWeight:700,padding:'2px 8px',borderRadius:9999,
      background:(col||C.teal)+'12',color:col||C.teal,border:'1px solid '+(col||C.teal)+'35',
      whiteSpace:'nowrap'}},evt);
    const fieldChip=f=>h('span',{style:{display:'inline-block',fontFamily:'JetBrains Mono,monospace',
      fontSize:8.5,padding:'1px 6px',borderRadius:4,background:'#6B7A9910',color:'#6B7A99',
      border:'1px solid #6B7A9930',whiteSpace:'nowrap',margin:'1px 2px'}},f);
    const secHead=label=>h('div',{style:{fontSize:9,fontWeight:800,color:C.faint,textTransform:'uppercase',
      letterSpacing:'.8px',padding:'9px 14px 4px',borderTop:'1px solid '+C.line}},label);

    // ── connection row (producer or consumer) ─────────────────────────────
    const connRow=(id,dir)=>{
      const fields=dir==='p'?getFields(id,a.id):getFields(a.id,id);
      const isEv=dir==='p'
        ?this.flowEdges.some(e=>e[0]===id&&e[1]===a.id)||this.aiEdges.some(e=>e[0]===id&&e[1]===a.id)
        :this.flowEdges.some(e=>e[0]===a.id&&e[1]===id)||this.aiEdges.some(e=>e[0]===a.id&&e[1]===id);
      return h('div',{key:id,style:{padding:'4px 14px 5px',borderBottom:'1px solid '+C.line+'55'}},
        h('div',{style:{display:'flex',alignItems:'center',gap:5,marginBottom:fields.length?3:0}},
          h('span',{style:{fontSize:10,color:C.faint,flex:'none',fontWeight:700}},dir==='p'?'←':'→'),
          agLink(id),
          isEv?h('span',{style:{fontSize:8,fontWeight:700,color:C.teal,background:C.teal+'10',
            border:'1px solid '+C.teal+'25',borderRadius:3,padding:'0px 4px',
            marginLeft:'auto',flex:'none',fontFamily:'JetBrains Mono,monospace'}},'event'):null),
        fields.length?h('div',{style:{display:'flex',flexWrap:'wrap',gap:1,paddingLeft:14}},
          fields.slice(0,5).map(f=>fieldChip(f)),
          fields.length>5?h('span',{style:{fontSize:8.5,color:C.faint,padding:'1px 4px'}},
            '+'+(fields.length-5)+' more'):null):null); };

    return h('div',{style:{width:308,flex:'none',borderLeft:'1px solid '+C.border,background:C.panel,
      display:'flex',flexDirection:'column',overflow:'hidden'}},

      // ── header ──────────────────────────────────────────────────────────
      h('div',{style:{background:tc+'0D',borderBottom:'1px solid '+C.border,padding:'11px 14px 9px',flex:'none'}},
        h('div',{style:{display:'flex',alignItems:'flex-start',gap:6,marginBottom:5}},
          h('div',{style:{flex:1,minWidth:0}},
            h('div',{style:{fontSize:13,fontWeight:800,color:C.text,lineHeight:1.25,
              whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},a.name),
            h('div',{style:{fontSize:9,fontFamily:'JetBrains Mono,monospace',color:C.faint,marginTop:2}},a.id)),
          h('span',{style:{fontSize:8.5,fontWeight:700,padding:'2px 8px',borderRadius:9999,
            background:tc+'18',color:tc,border:'1px solid '+tc+'44',flex:'none',whiteSpace:'nowrap'}},a.type),
          h('button',{onClick:()=>this.setState({selectedNode:null}),title:'Close',
            style:{width:22,height:22,border:'none',background:'transparent',borderRadius:6,cursor:'pointer',
              font:'inherit',fontSize:16,color:C.faint,display:'flex',alignItems:'center',
              justifyContent:'center',flex:'none',lineHeight:1,padding:0}},'×')),
        h('div',{style:{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}},
          h('span',{style:{display:'flex',alignItems:'center',gap:4,fontSize:10.5,color:C.dim}},
            h('span',{style:{width:7,height:7,borderRadius:'50%',background:hc,flex:'none'}}),
            a.health||'—'),
          h('span',{style:{fontSize:11,fontWeight:700,color:C.text}},a.success.toFixed(1)+'%'),
          h('span',{style:{fontFamily:'JetBrains Mono,monospace',fontSize:9,color:C.faint}},a.version),
          h('span',{style:{fontSize:10,fontWeight:700,color:prioCol}},a.priority),
          a.owner?h('span',{style:{fontSize:10,color:C.faint}},a.owner):null)),

      // ── scrollable body ──────────────────────────────────────────────────
      h('div',{style:{flex:1,overflowY:'auto',paddingBottom:10}},

        // event wiring
        secHead('Event wiring'),
        h('div',{style:{padding:'5px 14px 6px',display:'flex',flexDirection:'column',gap:5}},
          h('div',{style:{display:'flex',alignItems:'center',gap:7,flexWrap:'wrap'}},
            h('span',{style:{fontSize:9,color:C.faint,fontWeight:700,minWidth:42,flex:'none'}},'LISTENS'),
            evtPill(a.evt,C.teal)),
          outEvts.length?h('div',{style:{display:'flex',alignItems:'flex-start',gap:7,flexWrap:'wrap'}},
            h('span',{style:{fontSize:9,color:C.faint,fontWeight:700,minWidth:42,paddingTop:2,flex:'none'}},'EMITS'),
            h('div',{style:{display:'flex',flexWrap:'wrap',gap:3}},
              outEvts.map((e,i)=>evtPill(e,C.navy)))):null),

        // blast radius
        secHead('Blast radius'),
        h('div',{style:{padding:'5px 14px 7px',display:'flex',alignItems:'center',gap:10}},
          h('div',{style:{fontSize:26,fontWeight:800,lineHeight:1,
            fontFamily:'JetBrains Mono,monospace',
            color:blastR===0?C.teal:blastR<4?C.amber:C.red}},
            String(blastR)),
          h('div',{},
            h('div',{style:{fontSize:11.5,color:C.text,fontWeight:600,lineHeight:1.3}},
              blastR===0?'No downstream dependencies'
              :blastR+' agent'+(blastR!==1?'s':'')+' downstream'),
            h('div',{style:{fontSize:10,color:C.faint,marginTop:1}},'affected if this agent breaks or changes'))),

        // conflicts
        myCfs.length?h('div',{},
          secHead('Conflicts ('+myCfs.length+')'),
          h('div',{style:{padding:'2px 0'}},
            myCfs.map(cf=>{
              const col=cf.severity==='critical'?C.red:C.amber;
              const peer=cf.a===a.id?cf.b:cf.a;
              const shortD=cf.detail?(cf.detail.split('.')[0]+'.').replace(/\s+/g,' '):'';
              const shortF=cf.fix?(cf.fix.split('.')[0]+'.').replace(/\s+/g,' '):'';
              return h('div',{key:cf.id,style:{padding:'6px 14px 7px',borderLeft:'3px solid '+col,
                background:col+'08',marginBottom:2}},
                h('div',{style:{display:'flex',alignItems:'center',gap:5,marginBottom:4,flexWrap:'wrap'}},
                  h('span',{style:{fontSize:8.5,fontWeight:800,fontFamily:'JetBrains Mono,monospace',
                    color:col,background:col+'15',border:'1px solid '+col+'30',borderRadius:3,
                    padding:'1px 5px'}},cf.id),
                  h('span',{style:{fontSize:8.5,fontWeight:700,color:col,textTransform:'uppercase'}},cf.severity),
                  h('span',{style:{fontSize:8.5,fontFamily:'JetBrains Mono,monospace',color:C.faint,marginLeft:'auto'}},cf.event||'')),
                h('div',{style:{display:'flex',alignItems:'baseline',gap:5,marginBottom:4}},
                  h('span',{style:{fontSize:9.5,color:C.faint,flex:'none'}},'with'),
                  agLink(peer)),
                shortD?h('div',{style:{fontSize:10.5,color:C.dim,lineHeight:1.45,marginBottom:5}},shortD):null,
                shortF?h('div',{style:{display:'flex',gap:5,alignItems:'flex-start'}},
                  h('span',{style:{fontSize:8.5,fontWeight:800,color:col,flex:'none',paddingTop:1}},'FIX ▶'),
                  h('span',{style:{fontSize:10,color:C.text,lineHeight:1.4}},shortF)):null);}))
        ):null,

        // producers
        producerIds.length?h('div',{},
          secHead('Producers ('+producerIds.length+')'),

  // ── conflict side panel ──────────────────────────────────────────────────
  _renderConflictPanel(){ const C=this.C,h=React.createElement;
    // Build clusters: group conflicts by event, also detect shared evt triggers
    const byEvt=new Map();
    this.conflicts.forEach(c=>{
      const key=c.event||'Unknown event';
      if(!byEvt.has(key)) byEvt.set(key,[]);
      byEvt.get(key).push(c);
    });
    // Detect agents sharing the same trigger event that aren't already in a conflict pair
    const byTrigger=new Map();
    this.agents.forEach(a=>{ if(!byTrigger.has(a.evt)) byTrigger.set(a.evt,[]); byTrigger.get(a.evt).push(a); });
    const proactive=[...byTrigger.entries()].filter(([evt,as])=>as.length>1&&!byEvt.has(evt));
    const clusters=[...byEvt.entries()].map(([evt,cfs])=>{
      const agentIds=[...new Set(cfs.flatMap(c=>[c.a,c.b]))];
      const agents=agentIds.map(id=>this.byId(id)).filter(Boolean);

      return h('div',{key:evt,onClick:()=>this.setState({screen:'conflicts'}),
        style:{padding:'11px 13px',borderLeft:'3px solid '+col,cursor:'pointer',background:col+'07',
          marginBottom:6,borderRadius:'0 8px 8px 0',transition:'background 120ms ease'},
        onMouseEnter:e=>e.currentTarget.style.background=col+'14',
        onMouseLeave:e=>e.currentTarget.style.background=col+'07'},
        h('div',{style:{display:'flex',alignItems:'center',gap:7,marginBottom:5}},
          this.pill(isCrit?'critical':'warning',col),
          h('span',{style:{fontSize:10,fontFamily:'JetBrains Mono,monospace',fontWeight:700,color:C.text,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},evt)),
        h('div',{style:{fontSize:11.5,color:C.dim,marginBottom:6}},
          agents.length+' agent'+(agents.length!==1?'s':'')+' fire on this event'),
        h('div',{style:{fontSize:10.5,color:C.amber,fontStyle:'italic',marginBottom:6}},'Evaluate execution ordering'),
        h('div',{style:{display:'flex',flexDirection:'column',gap:3}},
          agents.map(a=>h('div',{key:a.id,style:{display:'flex',alignItems:'center',gap:6}},
            h('span',{style:{width:5,height:5,borderRadius:'50%',background:this.typeColor(a.type),flex:'none'}}),
            h('span',{style:{fontFamily:'JetBrains Mono,monospace',fontSize:10,color:C.dim}},a.id))))); });
    const proactiveClusters=proactive.map(([evt,agents])=>{
      const col=C.faint;
      return h('div',{key:'pro-'+evt,style:{padding:'9px 13px',borderLeft:'3px solid '+C.border,background:C.panel2,marginBottom:5,borderRadius:'0 8px 8px 0'}},
        h('div',{style:{display:'flex',alignItems:'center',gap:7,marginBottom:4}},
          h('span',{style:{fontSize:9,fontWeight:700,color:C.faint,background:C.panel,border:'1px solid '+C.border,borderRadius:4,padding:'1px 6px'}},'MONITOR'),
          h('span',{style:{fontSize:10,fontFamily:'JetBrains Mono,monospace',color:C.dim,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},evt)),
        h('div',{style:{fontSize:11,color:C.faint}},agents.length+' agents share this trigger — no active conflict')); });
    return h('div',{style:{width:252,flex:'none',borderLeft:'1px solid '+C.border,background:C.panel,display:'flex',flexDirection:'column',overflow:'hidden'}},
      h('div',{style:{padding:'11px 14px',borderBottom:'1px solid '+C.border,display:'flex',alignItems:'center',gap:8,flex:'none'}},
        h('span',{style:{width:8,height:8,borderRadius:'50%',background:C.red,boxShadow:'0 0 0 3px '+C.red+'22'}}),
        h('span',{style:{fontSize:12,fontWeight:700,color:C.text}},'Conflict Detection'),
        this.conflicts.length?h('span',{style:{fontSize:10,fontWeight:700,color:C.red,background:C.red+'12',border:'1px solid '+C.red+'28',borderRadius:9999,padding:'2px 7px',marginLeft:'auto'}},this.conflicts.length+' active'):null),
      h('div',{style:{flex:1,overflowY:'auto',padding:'8px 10px'}},
        clusters.length||proactiveClusters.length?
          h('div',{},
            clusters.length?h('div',{style:{fontSize:9,fontWeight:700,color:C.faint,textTransform:'uppercase',letterSpacing:'.6px',padding:'2px 4px 6px'}},'Active conflicts'):null,
            ...clusters,
            proactiveClusters.length?h('div',{style:{fontSize:9,fontWeight:700,color:C.faint,textTransform:'uppercase',letterSpacing:'.6px',padding:'8px 4px 6px'}},'Shared triggers'):null,
            ...proactiveClusters):
          h('div',{style:{padding:'28px 14px',textAlign:'center',color:C.faint,fontSize:12}},'No conflicts detected')),
      h('div',{style:{padding:'10px 12px',borderTop:'1px solid '+C.border,flex:'none'}},
        this.btn('View all conflicts →',{onClick:()=>this.setState({screen:'conflicts'}),style:{width:'100%',justifyContent:'center'}}))); }

  // ── Draw.io export ───────────────────────────────────────────────────────
  _exportDrawio(){ const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

    const strokeMap={Tender:'#1a3270',Rating:'#1e56e0',Compliance:'#C07B0A',Document:'#7E8CA8',Invoice:'#A05EAF',AI:'#7048B8',Tracking:'#3B82C4'};

      const fill=fillMap[a.type]||'#FFFFFF'; const stroke=strokeMap[a.type]||'#E5E3E0';

      const ap=this._autoLayoutPos?.[a.id];const ax=ap?ap.x:a.gx,ay=ap?ap.y:a.gy;

      cells.push(`<mxCell id="fe${i}" style="edgeStyle=elbowEdgeStyle;strokeColor=#1e56e0;strokeWidth=2;" edge="1" source="${esc(e[0])}" target="${esc(e[1])}" parent="1"><mxGeometry relative="1" as="geometry"/></mxCell>`); });
    this.aiEdges.forEach((e,i)=>{

    this.conflicts.forEach((c,i)=>{

    const xml='<?xml version="1.0" encoding="UTF-8"?>\n<mxfile host="Katalyst" version="24.7.9" type="device">\n  <diagram id="katalyst-workflow" name="Katalyst Workflow">\n    <mxGraphModel dx="1422" dy="762" grid="1" gridSize="10" guides="1" tooltips="1" connect="1" arrows="1" fold="1" page="1" pageScale="1" pageWidth="1169" pageHeight="827" math="0" shadow="0">\n      <root>\n        '+cells.join('\n        ')+'\n      </root>\n    </mxGraphModel>\n  </diagram>\n</mxfile>';
    const ok=this.download('katalyst-workflow.drawio',xml,'application/xml');

  // ── Documentation export ─────────────────────────────────────────────────
  _exportDoc(){ const allEdges=[...this.flowEdges.map(e=>({from:e[0],to:e[1],kind:'deterministic'})),...this.aiEdges.map(e=>({from:e[0],to:e[1],kind:'ai-conditional'}))];
    const targets=new Set(allEdges.map(e=>e.to));
    const roots=this.agents.filter(a=>!targets.has(a.id));
    const lines=['# Katalyst Workflow Documentation','','> Generated: '+new Date().toLocaleString()+' — Tenant: Northwind Logistics (NWL) · OTM 26B','','---',''];
    lines.push('## Agent Summary','','| Agent | Domain | Type | Trigger | Version | Success |','|---|---|---|---|---|---|');
    this.agents.forEach(a=>lines.push(`| **${a.name}** | ${a.domain} | ${a.type} | \`${a.evt}\` | ${a.version} | ${a.success.toFixed(1)}% |`));
    lines.push('','---','','## Execution Flow','','The following documents the end-to-end automation sequence in execution order.','');
    const visited=new Set(); const queue=[...roots.map(a=>a.id)];
    while(queue.length){
      const id=queue.shift(); if(visited.has(id)) continue; visited.add(id);
      const a=this.byId(id); if(!a) continue;
      const out=allEdges.filter(e=>e.from===id);
      lines.push('### '+a.name,'');
      lines.push('| Field | Value |','|---|---|');
      lines.push(`| **Agent ID** | \`${a.id}\` |`);
      lines.push(`| **Domain** | ${a.domain} |`);
      lines.push(`| **Type** | ${a.type} |`);
      lines.push(`| **Version** | ${a.version} |`);
      lines.push(`| **Owner** | \`${a.owner}\` |`);
      lines.push(`| **Success rate** | ${a.success.toFixed(1)}% |`);
      lines.push(`| **Trigger** | ${a.trigger} (\`${a.evt}\`) |`,'');
      if(a.conditions&&a.conditions.length){lines.push('**Conditions evaluated:**','');a.conditions.forEach(c=>lines.push('- `'+c+'`'));lines.push('');}
      if(a.actions&&a.actions.length){lines.push('**Actions performed:**','');a.actions.forEach(ac=>lines.push('- `'+ac+'`'));lines.push('');}
      if(a.reads&&a.reads.length) lines.push('**Reads:** '+a.reads.map(r=>'`'+r+'`').join(', '),'');
      if(a.writes&&a.writes.length) lines.push('**Writes:** '+a.writes.map(w=>'`'+w+'`').join(', '),'');
      if(out.length){lines.push('**Downstream triggers:**','');out.forEach(e=>{const t=this.byId(e.to);if(t)lines.push('- → **'+t.name+'** via '+(e.kind==='ai-conditional'?'AI-conditional inference':'deterministic rule'));});lines.push('');}
      lines.push('---','');
      out.forEach(e=>{ if(!visited.has(e.to)) queue.push(e.to); });
    }
    this.agents.filter(a=>!visited.has(a.id)).forEach(a=>{
      lines.push('### '+a.name+' *(standalone)*','');
      lines.push('| Field | Value |','|---|---|');
      lines.push(`| **Agent ID** | \`${a.id}\` |`,`| **Domain** | ${a.domain} |`,`| **Trigger** | \`${a.evt}\` |`,'','---',''); });
    lines.push('## Conflict Log','');
    if(!this.conflicts.length){ lines.push('No conflicts detected.',''); }
    else {
      const byEvt=new Map();
      this.conflicts.forEach(c=>{ const k=c.event||'Unknown'; if(!byEvt.has(k))byEvt.set(k,[]); byEvt.get(k).push(c); });
      byEvt.forEach((cfs,evt)=>{
        const agents=[...new Set(cfs.flatMap(c=>[c.a,c.b]))].map(id=>{const a=this.byId(id);return a?a.name:id;});
        lines.push('### `'+evt+'`','');
        lines.push('**'+agents.length+' agents fire on this event** — evaluate execution ordering and sequencing rules.','');
        lines.push('| ID | Severity | Agent A | Agent B |','|---|---|---|---|');
        cfs.forEach(c=>{const a=this.byId(c.a),b=this.byId(c.b);lines.push(`| ${c.id} | **${c.severity}** | ${a?a.name:c.a} | ${b?b.name:c.b} |`);});
        if(cfs[0]&&cfs[0].note) lines.push('','> '+cfs[0].note);
        lines.push(''); }); }
    const ok=this.download('katalyst-workflow-docs.md',lines.join('\n'),'text/markdown');
    this.toast(ok?'Exported workflow documentation ('+this.agents.length+' agents, '+this.conflicts.length+' conflicts)':'Export failed'); }

  // ── Documentation Pack ───────────────────────────────────────────────────
  _generateDocPack(){
    const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const now=new Date();
    const dateStr=now.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
    const timeStr=now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
    const slug=now.getFullYear()+('0'+(now.getMonth()+1)).slice(-2)+('0'+now.getDate()).slice(-2);

    // ── BFS execution order ────────────────────────────────────────────────
    const allEdges=[...this.flowEdges.map(e=>({from:e[0],to:e[1],kind:'flow'})),...this.aiEdges.map(e=>({from:e[0],to:e[1],kind:'ai'}))];
    const targetSet=new Set(allEdges.map(e=>e.to));
    const seen=new Set(),bfsOrder=[];
    const bfsQ=this.agents.filter(a=>!targetSet.has(a.id)).map(a=>a.id);
    while(bfsQ.length){const id=bfsQ.shift();if(seen.has(id))continue;seen.add(id);const a=this.byId(id);if(a)bfsOrder.push(a);allEdges.filter(e=>e.from===id).forEach(e=>{if(!seen.has(e.to))bfsQ.push(e.to);});}
    this.agents.filter(a=>!seen.has(a.id)).forEach(a=>bfsOrder.push(a));

    // ── stats ──────────────────────────────────────────────────────────────
    const green=this.agents.filter(a=>a.health==='green').length;
    const amber=this.agents.filter(a=>a.health==='amber').length;
    const red=this.agents.filter(a=>a.health==='red').length;
    const crit=this.conflicts.filter(c=>c.severity==='critical').length;
    const warn=this.conflicts.filter(c=>c.severity==='warning').length;
    const avgSucc=(this.agents.reduce((s,a)=>s+a.success,0)/this.agents.length).toFixed(1);
    const domains=[...new Set(this.agents.map(a=>a.domain))].sort();
    const curEnv=(this.state&&this.state.env)||'PROD';

    // ── per-agent narrative ────────────────────────────────────────────────
    const domCtx={
      'Order Release':'manages the order release lifecycle, deciding which orders advance to tender and carrier selection',
      'Shipment Execution':'orchestrates physical shipment operations including carrier assignment, event tracking, and exception handling',
      'Invoice & Finance':'handles financial reconciliation, freight cost allocation, accruals, and billing verification',
      'Compliance & Customs':'enforces trade regulations, export controls, and import compliance at booking and shipment time',
      'Oracle AI':'applies machine-learning inference to continuously optimise carrier selection, lane economics, and demand forecasting',
      'Capacity & Yard':'manages physical yard resources, load planning optimisation, and dock capacity scheduling'
    };
    const narrative=a=>{
      const up=allEdges.filter(e=>e.to===a.id).map(e=>this.byId(e.from)).filter(Boolean);
      const dn=allEdges.filter(e=>e.from===a.id).map(e=>this.byId(e.to)).filter(Boolean);
      let t='The <strong>'+esc(a.name)+'</strong> ('+esc(a.id)+') '+(domCtx[a.domain]||'operates within the OTM automation framework')+'. ';
      t+='It fires on the <code>'+esc(a.evt)+'</code> event'+(up.length?' &mdash; following '+up.map(u=>'<strong>'+esc(u.name)+'</strong>').join(' and '):' as an entry-point agent')+(a.trigger?' ('+esc(a.trigger.split('(')[0].trim())+')'  :'')+'. ';
      if(a.conditions&&a.conditions.length){t+='Before acting it evaluates: <em>'+a.conditions.slice(0,2).map(c=>esc(c)).join('</em>, <em>')+(a.conditions.length>2?' and '+(a.conditions.length-2)+' more condition'+(a.conditions.length-2>1?'s':''):'')+'</em>. ';}
      if(a.actions&&a.actions.length){t+='On success it executes: <em>'+a.actions.slice(0,2).map(c=>esc(c)).join('</em>, <em>')+(a.actions.length>2?' plus '+(a.actions.length-2)+' further action'+(a.actions.length-2>1?'s':''):'')+'</em>. ';}
      if(dn.length)t+='It then triggers downstream: '+dn.map(d=>'<strong>'+esc(d.name)+'</strong>').join(', ')+'.';
      return t;
    };

    // ── static SVG workflow diagram ────────────────────────────────────────
    const fMap={Tender:'#EBF1FA',Rating:'#E8F7F5',Compliance:'#FBF5E6',Document:'#EFF1F7',Invoice:'#F5ECF8',AI:'#F0EBF8',Tracking:'#E6F1FA'};
    const sMap={Tender:'#1a3270',Rating:'#1e56e0',Compliance:'#C07B0A',Document:'#7E8CA8',Invoice:'#A05EAF',AI:'#7048B8',Tracking:'#3B82C4'};
    const hCol={green:'#1E7F5A',amber:'#B86E00',red:'#C74634'};
    const ep=(a,b,bow)=>{bow=bow||0;const ax=a.gx+95,ay=a.gy+44,bx=b.gx+95,by=b.gy+44,mx=(ax+bx)/2,my=(ay+by)/2,dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len,cx=mx+nx*bow,cy=my+ny*bow;return 'M'+ax+' '+ay+' Q'+cx+' '+cy+' '+bx+' '+by;};
    const apOf=a=>{const p=this._autoLayoutPos?.[a.id];return p||{x:a.gx,y:a.gy};};
    const xs=this.agents.map(a=>apOf(a).x),ys=this.agents.map(a=>apOf(a).y);
    const svgMinX=Math.min(...xs)-30,svgMinY=Math.min(...ys)-30,svgMaxX=Math.max(...xs)+220,svgMaxY=Math.max(...ys)+120;
    const vbW=svgMaxX-svgMinX,vbH=svgMaxY-svgMinY;
    const mkArr=(id,col)=>'<marker id="'+id+'" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="'+col+'"/></marker>';
    const svgDefs='<defs>'+mkArr('dat','#1e56e0')+mkArr('dap','#7048B8')+mkArr('dar','#C74634')+mkArr('daa','#B86E00')+'</defs>';
    const svgParts=[];
    this.flowEdges.forEach(e=>{const a=this.byId(e[0]),b=this.byId(e[1]);if(a&&b)svgParts.push('<path d="'+ep(a,b)+'" fill="none" stroke="#1e56e0" stroke-width="2" stroke-linecap="round" marker-end="url(#dat)"/>');}); 
    this.aiEdges.forEach(e=>{const a=this.byId(e[0]),b=this.byId(e[1]);if(a&&b)svgParts.push('<path d="'+ep(a,b)+'" fill="none" stroke="#7048B8" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round" marker-end="url(#dap)"/>');}); 
    this.conflicts.forEach(c=>{const a=this.byId(c.a),b=this.byId(c.b);if(a&&b){const col=c.severity==='critical'?'#C74634':'#B86E00';svgParts.push('<path d="'+ep(a,b,38)+'" fill="none" stroke="'+col+'" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round" marker-end="url(#'+(c.severity==='critical'?'dar':'daa')+')"/>');}});
    this.agents.forEach(a=>{
      const fill=fMap[a.type]||'#FFFFFF',stroke=sMap[a.type]||'#CCCCCC',hc=hCol[a.health]||'#999';
      const nm=a.name.length>22?a.name.slice(0,21)+'\u2026':a.name;

        '<g>'
        +'<rect x="'+ap.x+'" y="'+ap.y+'" width="190" height="88" rx="10" fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.5"/>'

        +'<text x="'+(ap.x+10)+'" y="'+(ap.y+44)+'" font-size="9" font-family="JetBrains Mono,monospace" fill="#6B7AA0">'+esc(a.evt)+'</text>'

        +'<text x="'+(ap.x+10)+'" y="'+(ap.y+78)+'" font-size="8" font-family="Inter,system-ui,sans-serif" fill="#B0B8CC">'+esc(a.domain)+'</text>'
        +'</g>'
      );
    });
    const staticSvg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+svgMinX+' '+svgMinY+' '+vbW+' '+vbH+'" style="width:100%;height:auto;display:block;border-radius:8px;background:#F8F9FB">'+svgDefs+svgParts.join('')+'</svg>';

    // ── draw.io XML embedded as data-URI download ──────────────────────────
    const xe=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    const dxCells=['<mxCell id="0"/>','<mxCell id="1" parent="0"/>'];

      const label=xe(a.name)+'&#xa;'+xe(a.evt)+'&#xa;'+xe((a.version||'')+' \u00b7 '+a.success.toFixed(1)+'%');

  // ---------- COMPARE ----------
  _parseStepGroups(rows){ const groups=[]; let cur=null;
    rows.forEach((row,i)=>{
      const txt=(row.l.txt||row.r.txt||'').toLowerCase();
      const cat=txt.startsWith('trigger:')?'TRIGGER':txt.startsWith('version:')||txt.startsWith('priority:')||txt.startsWith('model:')||txt.startsWith('confidence')||txt.startsWith('success')?'META':txt.startsWith('condition:')?'CONDITIONS':txt.startsWith('read:')?'READS':txt.startsWith('action:')||txt.startsWith('#')?'ACTIONS':txt.startsWith('write:')?'WRITES':'OTHER';
      if(!cur||cur.cat!==cat){cur={cat,rows:[]};groups.push(cur);}
      cur.rows.push({row,i});
    });
    return groups; }

  _depWarnings(rows,envLeft,envRight){
    const testOnly=new Set(['TENDER_HINT','DWELL_FORECAST','CLAIM_RATE','EXCEPTION_LOG','SLA_CLOCK_START','LINEHAUL_AMT','ACCESSORIAL_AMT']);
    // Fields that require per-environment OTM Qualifier / REFNUM type registration
    const REFNUM_TYPES=new Set(['CARRIER_SCORE','WEATHER_INDEX','CARRIER_RANK_HINT','DWELL_INDEX','LANE_SCORE','RISK_SCORE','CARRIER_TIER','CLAIM_RATE_INDEX']);
    const dep=new Map(), refnum=new Map();
    rows.forEach((row,i)=>{
      const changed=row.r.t==='add'||row.r.t==='mod'||row.l.t==='del';
      if(!changed) return;
      const txt=row.r.txt||row.l.txt||'';
      const isNewRead=/^read:/i.test(txt)&&row.r.t==='add';
      (txt.match(/\b[A-Z][A-Z0-9_]{2,}\b/g)||[]).forEach(f=>{
        if(testOnly.has(f)&&envLeft==='PROD'&&!dep.has(i))
          dep.set(i,f+' referenced here does not exist in '+envLeft+' — verify this field is backfilled before promoting.');
        if(isNewRead&&REFNUM_TYPES.has(f)&&envLeft==='PROD'&&!refnum.has(i))
          refnum.set(i,{field:f,msg:'Verify '+f+' exists in '+envLeft+' Qualifier setup before promoting.'});
      });
    });
    return {dep,refnum}; }
